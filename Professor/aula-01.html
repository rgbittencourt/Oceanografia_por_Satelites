<script type="application/json" id="aula-lesson">
{"meta":{"title":"Fundamentos de radar: como enxergar com micro-ondas e eco","courseTitle":"Introdução à Radares","weekNumber":1,"unit":"aula","weekLabel":"Aula 1","calendarStartDate":"","calendarEndDate":"","author":"Rafael S. Bittencourt","role":"Mestrando Oceanografia","institution":"FURG","year":"2026","license":"https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br","aiTool":"ClassAuthor (INOVALAB - IFSC)","aiUse":", uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt.","generatedBy":"Conteúdo elaborado com ClassAuthor, uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt, INOVALAB - IFSC.","a11yIgnored":["text-empty|c-resource-bridge-1-003|Parágrafo vazio","text-empty|c-resource-bridge-1-052|Parágrafo vazio","text-long|c-prose-1-021|Parágrafo muito longo","text-long|c-prose-1-022|Parágrafo muito longo","text-long|cwvi3htk|Parágrafo muito longo","img-alt-long|c-figure-w1-f3|Texto alternativo longo","text-long|c-prose-1-024|Parágrafo muito longo","img-alt-long|c-figure-w1-f5|Texto alternativo longo","img-alt-long|c-figure-w1-f7|Texto alternativo longo","text-long|cik6g43q|Parágrafo muito longo","img-alt-long|c-figure-w1-f9|Texto alternativo longo","img-alt-long|c-figure-w1-f10|Texto alternativo longo","interactive-keyboard|c-accordion-1-002|Teste este bloco só com o teclado"]},"blocks":[{"id":"b-hero-1-001","type":"hero","bg":"neutral-default","pad":"normal","props":{"eyebrow":"AULA 1","title":"Fundamentos de radar: como enxergar com micro-ondas e eco","lead":"Explicar como o radar mede distância a partir do tempo de ida e volta de um pulso de micro-ondas e calcular a distância ao alvo com R = c·t/2 (Seções 1 e 5).","author":"Rafael S. Bittencourt","authorImage":"assets/images/aula-01-image-001.jpg","readTime":"2 h de estudo","date":"2026"}},{"id":"b-topic-1-002","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-welcome-1-001","type":"prose","props":{"body":"<p>Bem-vindos ao curso. Começamos hoje pela pergunta mais básica que o assunto permite: como \"enxergar\" algo sem luz, só com eco? Quem já gritou dentro de um túnel e esperou a voz voltar sabe uma parte da resposta, e é com essa intuição que vamos construir, aula a aula, a física que sustenta toda a oceanografia feita com micro-ondas.</p><p>Hoje montamos o vocabulário: de onde o radar veio, onde ficam as micro-ondas no espectro, por que o radar trabalha de dia, de noite e sob nuvem, como ele mede distância e movimento, e como a potência do eco depende de antena, distância e superfície. Na Aula 2 levamos tudo isso para a superfície do mar e perguntamos por que um mar calmo pode parecer \"escuro\" e um mar agitado \"brilhante\" para o radar. Guardem essa pergunta, porque ela só faz sentido depois do que vem agora.</p>","dropcap":true,"dropcapTone":"terracotta"}},{"id":"c-objectives-1-002","type":"destaque","props":{"title":"Objetivos de aprendizagem","body":"<ul><li>Explicar como o radar mede distância a partir do tempo de ida e volta de um pulso de micro-ondas e calcular a distância ao alvo com <i><b>R = c·t/2</b></i> (Seções 1 e 5).</li><li>Relacionar frequência, comprimento de onda e bandas de radar (<i><b>P</b></i>, <b><i>L</i></b>, <b><i>S</i></b>, <b><i>C</i></b>, <b><i>X</i></b>, <b><i>Ku</i></b>, <b><i>K</i></b>, <b><i>Ka</i></b>) e situar as micro-ondas no espectro eletromagnético (Seção 3).</li><li>Justificar, distinguindo sensores ativos de passivos, por que o radar observa o mar de dia, de noite e sob nuvens, reconhecendo que chuva forte em bandas curtas pode atenuar o sinal (Seção 4).</li><li>Interpretar o desvio Doppler de um eco e calcular a velocidade radial de um alvo com <b><i>Δf = 2·vr·f/c</i></b> (Seção 6).</li><li>Interpretar cada termo da equação do radar (<b><i>Pt</i></b>, <b><i>G²</i></b>, <b><i>λ²</i></b>,<i><b> σ⁰</b></i>, <b><i>A</i></b>, <b><i>R⁴</i></b>), prever o efeito de dobrar a distância sobre a potência recebida e usar a escala em decibéis (Seção 7).</li><li>Avaliar a origem militar do radar e a transformação do <b>sea clutter</b>&nbsp;em sinal oceanográfico, apontando limites e pontos <i>\"a conferir\"</i> nas fontes citadas (Seções 2 e 5).</li></ul>","tone":"sage","icon":""}},{"id":"c-title-1-003","type":"titulo","props":{"text":"1 Como \"enxergar\" sem luz, só com eco?","level":"h2"}},{"id":"c-prose-1-021","type":"prose","props":{"body":"<p>Uma frente fria sobe do Atlântico Sul e, por três dias, o litoral do Rio Grande do Sul fica sob uma camada contínua de nuvens. A Lagoa dos Patos some das imagens de satélite que dependem da luz do Sol, justamente quando o vento de sudoeste empurra a água e muda tudo o que um oceanógrafo gostaria de acompanhar. É comum, em sala, alguém perguntar: \"então o satélite fica cego?\". Para os sensores ópticos, sim. Para o radar, não, e o motivo está numa ideia tão antiga quanto o morcego.</p><p>O morcego emite um grito agudo, espera o eco e, pelo intervalo entre uma coisa e outra, sabe a que distância está a parede ou o inseto. Ele não precisa de luz nenhuma. O radar faz exatamente isso, trocando o som por <strong>ondas de rádio</strong>: emite um pulso, espera que ele bata no alvo e volte, e cronometra a ida e a volta. Como a velocidade dessas ondas é conhecida, o tempo vira distância. O termo <strong>radar</strong> é um acrônimo de <em>radio detection and ranging</em>, \"detecção e alcance por rádio\", e a parte do \"alcance\" é justamente essa medida de distância (Rafael S. Bittencourt. Radares, p. 3).</p><p>O ponto de partida, então, é este: o radar mede tempo, e o que ele leva de volta no eco carrega mais do que distância. A intensidade do eco muda conforme a superfície que o devolveu, e o desvio de frequência denuncia movimento. Para um oceanógrafo, isso é um convite: o mar devolve ecos diferentes conforme esteja liso ou encrespado, e essa diferença pode ser medida sem que ninguém precise ver nada.</p><p>Há uma razão prática para a oceanografia ter investido nisso. O livro de G. A. Maul, <em>Introduction to satellite oceanography</em>, traz uma tabela (Table 1.1, p. 12) que relaciona propriedades do oceano às técnicas capazes de observá-las remotamente: temperatura da superfície, salinidade, correntes, marés, estado do mar, ventos de superfície, gelo, frentes oceânicas, partículas em suspensão e petroquímicos à deriva. Em várias dessas linhas aparece a técnica de micro-ondas, ativa ou passiva. A tabela chegou ao texto com ruído de digitalização, então os itens e a associação de cada um à técnica de micro-ondas <strong>a conferir</strong> na edição original antes de citá-la linha a linha. Em geral, a faixa de micro-ondas permite observar muito do oceano que a luz visível não alcança.</p><p>Nas próximas seções, vamos destrinchar cada peça dessa ideia, começando por onde o radar nasceu e por que seu uso científico veio de carona com a guerra.</p>","dropcap":true,"dropcapTone":"terracotta"}},{"id":"cojmxaf0","type":"imagem","props":{"src":"assets/images/aula-01-image-002.jpg","slotId":"","caption":"O mar continua ali, rugoso e em movimento, mesmo quando o céu encoberto esconde tudo dos sensores ópticos.","credit":"Ilustração criada por IA (ChatGPT, OpenAI)","ratio":"16/9"}},{"id":"c-resource-bridge-1-003","type":"prose","props":{"body":"","dropcap":false,"dropcapTone":"terracotta","inlineVideo":{"id":"F0vdIu1SfaQ","title":"Radar: por que dois alvos aparecem como um só? | PSCPP","caption":"Recurso contextualizado para a aula.","credit":"Praticagem Aberta | PSCPP · Praticagem Aberta | PSCPP","start":""}}},{"id":"c-veja-mais-1-001","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>Recurso contextualizado para a aula.</p><p>🔗 <a href=\"https://doi.org/10.1007/978-1-935704-15-7_3\" target=\"_blank\" rel=\"noopener\">Radar Meteorology at Radiation Laboratory, MIT, 1941 to 1947</a> — Radar in Meteorology</p>","tone":"sage","icon":""}},{"id":"c-reflexao-1-001","type":"reflexao","props":{"title":"Para refletir","question":"se você tivesse só um apito e um cronômetro, como mediria a distância até um paredão de pedra no costão de Torres? Que informação você ainda precisaria ter, além do tempo?","body":"","tone":"lavender","icon":""}},{"id":"c-title-1-004","type":"titulo","props":{"text":"2 De onde vem o radar: origem militar e uso científico","level":"h2"}},{"id":"c-prose-1-022","type":"prose","props":{"body":"<p>O radar não nasceu em laboratório de oceanografia, e o oceanógrafo que o usa hoje herdou um instrumento pensado para outro fim. Entender essa origem não é curiosidade de historiador: ela explica por que o vocabulário do radar é tão cheio de termos militares e por que um dos maiores incômodos dos operadores navais virou, depois, um dos dados mais valiosos da área.</p><p>Começando pelo nome, o <strong>radar</strong> (<em>radio detection and ranging</em>) foi concebido para detectar objetos distantes e estimar a que distância estavam, usando ondas de rádio (Rafael S. Bittencourt. Radares, p. 3). Quem precisava disso, antes de qualquer pesquisa científica, eram forças armadas querendo localizar navios e aviões inimigos. Segundo Maul, durante a Segunda Guerra Mundial houve um esforço de pesquisa muito intenso em tecnologia de micro-ondas, concentrado no Radiation Laboratory do Instituto de Tecnologia de Massachusetts, o MIT. Desse esforço teriam saído 29 volumes sobre engenharia de radar, e o primeiro deles, editado por L. N. Ridenour com o título <em>Radar System Engineering</em>, resumiu o estado da arte em 1947 (G. A. Maul. Introduction to satellite oceanography, p. 413). Pela leitura do autor, boa parte da tecnologia que culminaria nos satélites oceanográficos já estava em desenvolvimento antes da metade do século.&nbsp;</p><p>A virada científica tem uma história saborosa. Navios mercantes e de guerra tinham um problema crônico: o próprio mar devolvia ecos ao radar, e esses ecos podiam esconder um barco pequeno ou uma aeronave voando baixo. Esse ruído ganhou nome, <em><strong>sea clutter</strong></em>, algo como \"desordem do mar\". Os engenheiros desenvolveram circuitos especiais para suprimi-lo. Só que, observa Maul, o <em>sea clutter</em> se mostrou estatisticamente correlacionado com a velocidade e a direção do vento, e a partir daí teriam surgido transceptores projetados para otimizar justamente esse sinal retroespalhado (G. A. Maul. Introduction to satellite oceanography, p. 479).&nbsp;</p><p>O reconhecimento institucional veio mais tarde. Segundo Maul, a discussão séria sobre apontar esses instrumentos para o mar teria ganhado força depois da conferência de 1964 no Woods Hole Oceanographic Institution, presidida por Gifford Ewing, e a radio-oceanografia teria, na época do texto, apenas cerca de duas décadas como disciplina (G. A. Maul. Introduction to satellite oceanography, p. 413). O&nbsp;desenho geral que o texto sustenta é: guerra, depois conferência, depois disciplina.</p><p>Resta saber onde, no espectro eletromagnético, essas ondas vivem e por que as bandas receberam letras que ninguém consegue adivinhar.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cpvm0bri","type":"imagem","props":{"src":"assets/images/aula-01-image-003.jpg","slotId":"","caption":"O hardware que a guerra produziu é, em essência, o mesmo conjunto de transmissor, antena e receptor que ainda hoje sustenta as medidas científicas.","credit":"Ilustração criada por IA (ChatGPT, OpenAI)","ratio":"16/9"}},{"id":"c-veja-mais-1-011","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>Antes de entrar na física do pulso e do eco, vale entender de onde vem o radar. Neste texto, escrito logo após a guerra por um dos protagonistas do Radiation Laboratory do MIT, você verá como uma tecnologia militar de detecção de aeronaves e navios já nascia com potencial científico. Leia buscando duas ideias: o que o radar permitiu fazer que a visão e a luz não permitiam e como o autor imagina seu uso em tempos de paz. Isso prepara o caminho para a pergunta da aula: como 'enxergar' algo sem luz, só com eco?</p><p>🔗 <a href=\"https://doi.org/10.1109/ee.1946.6441669\" target=\"_blank\" rel=\"noopener\">Radar in war and peace</a> — Electrical Engineering</p>","tone":"sage","icon":""}},{"id":"c-pitaco-1-102","type":"pitaco","props":{"kicker":"Dica","name":"Rafael S. Bittencourt","role":"","tone":"coral","src":"assets/images/aula-01-image-001.jpg","slotId":"c-pitaco-1-102","body":"<p><i>Guarde o caso do sea clutter como lembrete de que \"ruído\" e \"sinal\" dependem de quem faz a pergunta. O mesmo eco que atrapalhava o operador naval é o dado que o oceanógrafo quer medir.</i></p>"}},{"id":"c-title-1-005","type":"titulo","props":{"text":"3 O espectro eletromagnético e as bandas de radar","level":"h2"}},{"id":"c-prose-1-023","type":"prose","props":{"body":"<p>\"Radar de banda C\", \"banda X\", \"banda L\": o estudante de oceanografia vê essas letras nos manuais e tende a decorar sem entender a lógica. A lógica existe, mas é parcialmente acidental, e dominá-la exige antes uma ideia simples: toda onda eletromagnética tem uma <strong>frequência</strong> (quantos ciclos por segundo, medida em hertz, Hz) e um <strong>comprimento de onda</strong> (a distância entre duas cristas, em metros ou centímetros), e as duas grandezas são amarradas pela velocidade da luz, c. A relação é:</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"ccrcnium","type":"equacao","props":{"latex":"λ = c/f","number":"(1)","showNumber":true,"ariaLabel":"","size":130,"autoFit":true,"framed":false}},{"id":"cwvi3htk","type":"prose","props":{"body":"<p>Frequência alta significa comprimento de onda curto; frequência baixa, comprimento de onda longo.</p><p>O <strong>espectro eletromagnético</strong> é o conjunto de todas as frequências possíveis, da rádio-frequência, passando pelas micro-ondas, o infravermelho e o visível, até a radiação de maior energia. As <strong>micro-ondas</strong> ocupam, em geral, a faixa de comprimentos de onda de poucos centímetros a algumas dezenas de centímetros (as bandas de radar listadas adiante vão de cerca de 1cm a cerca de 115cm), e é nessa faixa que mora o radar. Maul lembra que a mente humana gosta de compartimentar o espectro conforme os limites dos nossos sentidos, mas o universo físico não reconhece essas fronteiras (G. A. Maul. Introduction to satellite oceanography, p. 15).</p><p>As letras das bandas, então, vêm de onde? Maul explica que, \"por razões históricas\", os comprimentos de onda de radar receberam abreviações alfabéticas (G. A. Maul. Introduction to satellite oceanography, p. 15). Segundo a Table 1.2 do livro, os valores centrais são aproximadamente: <b><i>P</i></b>, cerca de <i><b>115cm</b></i>; <i><b>L</b></i>, <i><b>20cm</b></i>; <i><b>S</b></i>, <b><i>10cm</i></b>; <i><b>C</b></i>, <i><b>5cm</b></i>; <b><i>X</i></b>, <i><b>3cm</b></i>; <b><i>Ku</i></b>, <b><i>2cm</i></b>; <b><i>K</i></b>, <b><i>1,35cm</i></b>; e <b><i>Ka</i></b>, <i><b>1cm</b></i>. A tabela chegou com ruído de digitalização, então <strong>todos os valores são a conferir</strong> na obra antes do uso em avaliação; o que o texto sustenta com segurança é a ordem de grandeza: das bandas longas (<b><i>P </i></b>e <b><i>L</i></b>, dezenas de centímetros) às curtas (<i><b>Ku</b></i>, <i><b>K </b></i>e <i><b>Ka</b></i>, de poucos centímetros).</p><p>O que a banda muda na prática, ao atravessar o ar e ao tocar o mar, é uma pergunta que fica pendente. Antes de respondê-la, falta entender por que um radar, e não uma câmera, é o instrumento certo quando as nuvens chegam.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-figure-w1-f3","type":"imagem","props":{"src":"assets/images/aula-01-image-004.svg","slotId":"figure-w1-f3","caption":"As letras das bandas são um código histórico, mas a posição de cada uma no espectro é pura física: quanto maior a frequência, menor o comprimento de onda.","credit":"Ilustração criada por IA (Claude, Anthropic)","alt":"Espectro eletromagnético em escala logarítmica de frequência e comprimento de onda, com destaque para a região de micro-ondas e subdividida nas bandas P, L, S, C, X, Ku, K e Ka, cada uma rotulada com sua faixa de frequência em MHz ou GHz e com o comprimento de onda central aproximado em centímetros; ao lado, marcar de forma referencial a posição do infravermelho e da luz visível","ratio":"16/9"}},{"id":"c9wyjrap","type":"imagem","props":{"src":"assets/images/aula-01-image-005.png","slotId":"","caption":"A letra da banda é só um rótulo; o que o estudante precisa guardar é o comprimento de onda associado a ela.","credit":"Ilustração criada por IA (NapkinAI)","ratio":"16/9"}},{"id":"c-pitaco-1-201","type":"pitaco","props":{"kicker":"Dica","name":"Rafael S. Bittencourt","role":"","tone":"ocean","src":"assets/images/aula-01-image-001.jpg","slotId":"c-pitaco-1-201","body":"<p><i>Para fixar <b>λ = c/f</b>, faça uma conta de cabeça. Com <b>c ≈ 3 × 10⁸ m/</b>s e <b>f = 3 GHz (3 × 10⁹ Hz)</b>, <b>λ = 10 cm</b>. Conhecendo esse ponto de ancoragem, o resto da tabela fica fácil de reconstituir.</i></p>"}},{"id":"c-title-1-006","type":"titulo","props":{"text":"4 Sensores ativos e passivos: por que o radar enxerga de dia, de noite e com nuvem","level":"h2"}},{"id":"c-prose-1-024","type":"prose","props":{"body":"<p>Imagine uma frente fria cruzando o litoral gaúcho numa tarde de inverno: o céu fecha, a Lagoa dos Patos some atrás de um teto cinzento e, para qualquer sensor que dependa da luz do Sol refletida na água, o mar simplesmente deixou de existir. Para o radar, nada mudou. Essa diferença tem nome técnico e é a primeira distinção que vocês precisam ter clara na cabeça: <strong>sensor passivo</strong> é aquele que só recebe a energia que já existe no ambiente (a luz do Sol refletida, o calor que a própria Terra emite), e <strong>sensor ativo</strong> é aquele que fabrica a própria energia, a lança contra o alvo e escuta o que volta.</p><p>A analogia mais direta é a da câmera. Uma máquina fotográfica sem flash é passiva: depende da luz disponível e fica cega à noite. Com flash, ela passa a carregar a sua fonte de iluminação. O radar é o flash que nunca se apaga, e por isso a hora do dia não entra na conta. Já o radiômetro (o instrumento que mede, por exemplo, a temperatura da superfície do mar por infravermelho) trabalha como a lanterna que alguém esqueceu em casa: só funciona se houver quem ilumine por ele.</p><p>Resta explicar por que a nuvem, em geral, não atrapalha o radar. A resposta está no comprimento de onda. As gotículas de uma nuvem comum são minúsculas diante de uma micro-onda de alguns centímetros, e uma onda tende a ser barrada de modo eficiente por partículas comparáveis ao seu tamanho. No visível, onde o comprimento de onda é da ordem de frações de micrômetro, as gotículas espalham e bloqueiam a luz. Maul observa, aliás, que o sensoriamento remoto em comprimentos de onda abaixo de 400 nm é pouco desenvolvido porque há pouca energia natural disponível e muito sinal atmosférico causado pelo espalhamento de Rayleigh (MAUL, p. 15). Já o infravermelho térmico, na faixa de 8 a 14 μm, é pesquisado desde os anos 1950 como janela para o calor emitido pelo mar, mas nuvens espessas também o interrompem (MAUL, p. 15). A região das micro-ondas, onde moram as bandas de radar, é usada tanto de forma ativa quanto passiva. Essa transparência não é absoluta: chuva forte, sobretudo nas bandas curtas, pode atenuar o sinal.</p><p>A Tabela 1.1 de Maul (p. 12) ajuda a ver o alcance prático disso: ela lista propriedades do oceano acessíveis por sensoriamento remoto, e várias aparecem associadas a técnicas de micro-ondas, ativas ou passivas (por exemplo, vento na superfície, estado do mar, gelo, correntes e frentes oceânicas, <strong>a conferir</strong> na edição original, dado o ruído de digitalização da tabela). Ou seja, o radar não é uma curiosidade de laboratório; em geral, é uma das poucas maneiras de olhar o mar quando o resto do espectro está bloqueado.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-figure-w1-f5","type":"imagem","props":{"src":"assets/images/aula-01-image-006.svg","slotId":"figure-w1-f5","caption":"O sensor passivo depende de uma fonte externa; o ativo leva a sua e atravessa a nuvem.&nbsp;","credit":"Ilustração criada por IA (Claude, Anthropic)","alt":"esquema lado a lado comparando sensor passivo e sensor ativo. À esquerda, o Sol ilumina o mar e a energia refletida ou emitida sobe até um sensor passivo no alto, com uma nuvem espessa interrompendo o caminho da luz visível. À direita, um sensor ativo emite um pulso de micro-ondas (seta para baixo), que atravessa a mesma nuvem, atinge o mar e retorna (seta para cima). Rótulos: fonte de energia, sensor passivo, sensor ativo, nuvem, superfície do mar","ratio":"16/9"}},{"id":"c-veja-mais-1-031","type":"destaque","props":{"title":"🔎 Veja mais aqui","body":"<p>Até aqui o radar foi apresentado como um sensor que gera o próprio sinal. Este capítulo mostra o outro lado da moeda: sensores que apenas medem a radiação micro-ondas já emitida pela Terra. Leia com o objetivo de responder à pergunta-chave desta seção: o que muda, para o oceano, quando a fonte de energia é externa (Sol) ou própria? Ao comparar as duas abordagens, fica claro por que as micro-ondas atravessam nuvens e funcionam à noite, e por que um radar ativo independe da iluminação solar.</p><p>🔗 <a href=\"https://doi.org/10.1017/cbo9781139017411.008\" target=\"_blank\" rel=\"noopener\">Passive microwave systems</a> — Physical Principles of Remote Sensing</p>","tone":"sage","icon":""}},{"id":"c-atencao-1-301","type":"atencao","props":{"title":"Atenção","body":"<p><i>\"Enxergar através da nuvem\" não quer dizer \"ser imune à atmosfera\". Chuva forte, com gotas grandes o bastante para rivalizar com o comprimento de onda, atenua e espalha o sinal, e o efeito cresce quanto mais curta a onda. Voltaremos a isso quando discutirmos o que amortece o sinal na Aula 2, e vocês já podem guardar a pergunta: se a banda importa para a chuva, o que mais ela controla? Para responder, precisamos primeiro abrir a caixa do radar e ver como ele mede.</i></p>","tone":"sage","icon":""}},{"id":"c-title-1-007","type":"titulo","props":{"text":"5 Anatomia de um radar: pulso, eco e distância","level":"h2"}},{"id":"c-prose-1-025-p0","type":"prose","props":{"body":"<p>Quando alguém grita diante de um paredão de pedra e ouve a própria voz voltar, o cérebro faz sem esforço uma conta de radar: quanto mais demora o eco, mais longe está a parede. O radar faz exatamente isso, só que no lugar do grito há um <strong>pulso</strong> (uma rajada curtíssima de micro-ondas) e, no lugar do ouvido, um receptor sensível. O retorno dessa rajada, refletido pelo alvo, é o <strong>eco</strong>. Quem lê Bittencourt encontra a descrição mínima do equipamento: um transmissor que emite o sinal, um receptor que recebe o que o alvo devolve, e em alguns sensores a mesma antena cumprindo as duas funções (BITTENCOURT, p. 3).</p><p>Vamos separar os componentes, porque cada um resolve um problema específico:</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-prose-1-025-t0","type":"tabela","props":{"caption":"Componentes de Radar","fonte":"","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Componente","O que faz","Analogia"],"rows":[["Transmissor","Gera o pulso de micro-ondas","A voz que grita"],["Antena","Concentra o pulso numa direção e capta o eco","O funil da boca e da orelha"],["Duplexador","Alterna a antena entre transmitir e receber","O \"revezamento\" entre falar e escutar"],["Receptor","Amplifica e registra o eco, que volta fraquíssimo","O ouvido atento"]]}},{"id":"c-prose-1-025-p1","type":"prose","props":{"body":"<p>O duplexador merece uma palavra a mais. Quando a mesma antena serve aos dois papéis, o pulso que sai é milhões de vezes mais forte que o eco que volta; sem uma chave que proteja o receptor durante a emissão, ele seria \"ensurdecido\" pelo próprio radar. Daí a lógica do pulso curto: o radar fala, silencia e escuta, e repete o ciclo. O número de pulsos emitidos por segundo é a <strong>PRF</strong> (<em>Pulse Repetition Frequency</em>, frequência de repetição de pulsos).</p><p>Agora a conta que dá sentido a tudo. O pulso viaja à velocidade da luz, c, que vale cerca de <b><i>3 × 10⁸ m/s</i></b>, vai até o alvo e volta. Se o radar mede o tempo total t entre a saída e a chegada do eco, o caminho percorrido foi o dobro da distância ao alvo. Portanto:</p><p></p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cesmwed3","type":"equacao","props":{"latex":"R = c · t / 2\n\n","number":"(2)","showNumber":true,"ariaLabel":"","size":130,"autoFit":true,"framed":false}},{"id":"cy5rwrco","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">Um exemplo numérico típico mostra a ordem de grandeza: um eco que retorna 5 milissegundos depois da emissão corresponde a </span></p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cixf5kpo","type":"equacao","props":{"latex":"R = \\frac{(3 × 10⁸ × 5 × 10⁻³)}{2} = 7,5 × 10⁵ m","number":"(3)","showNumber":true,"ariaLabel":"","size":100,"autoFit":true,"framed":false}},{"id":"c6t0rzo1","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">Isto é, 750 km. Repare que <i><b>5ms</b></i> é um intervalo que nenhum ser humano percebe, e ainda assim ele separa o radar do alvo por uma distância equivalente à de Porto Alegre a Florianópolis em linha reta e um pouco mais. A precisão do relógio do radar, portanto, é tudo.</span></p><p>Há ainda um detalhe que costuma passar despercebido e que liga o ciclo à PRF. Maul descreve, para um pulso retangular refletido por um mar calmo, que o sinal de retorno forma uma rampa linear que sobe quando chega a borda dianteira do pulso e se estabiliza quando chega a traseira, e que a inclinação dessa rampa diminui conforme crescem as ondas da superfície (MAUL, p. 406). Essa descrição é <strong>a conferir</strong> na obra antes de ser usada em avaliação. Guardem a ideia: o formato do eco carrega informação sobre o mar, não apenas o instante em que ele chega.</p><p>Medir quanto tempo o eco demora é só metade da história. O eco não volta apenas atrasado: ele pode voltar com a frequência alterada, e é aí que o radar passa a contar também se o alvo está parado ou em movimento.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-figure-w1-f7","type":"imagem","props":{"src":"assets/images/aula-01-image-007.svg","slotId":"figure-w1-f7","caption":"O duplexador faz a antena trabalhar nos dois sentidos.","credit":"Ilustração criada por IA (Claude, Anthropic)","alt":"fluxograma do ciclo pulso-eco com os blocos transmissor, duplexador, antena, alvo e receptor, ligados por setas. Seta de ida do transmissor ao alvo, seta de volta do alvo ao receptor, com o intervalo de tempo t de ida e volta rotulado e a distância R indicada entre antena e alvo","ratio":"16/9"}},{"id":"c-destaque-1-401","type":"destaque","props":{"title":"Em uma frase","body":"<p><i>A distância ao alvo é metade do caminho percorrido pelo pulso, porque o tempo medido inclui a ida e a volta.</i></p>","tone":"sage","icon":""}},{"id":"c-pitaco-1-402","type":"pitaco","props":{"kicker":"Dica","name":"Rafael S. Bittencourt","role":"","tone":"sage","src":"assets/images/aula-01-image-001.jpg","slotId":"c-pitaco-1-402","body":"<p><i>O erro mais comum nas listas de exercício é esquecer de dividir por 2. Antes de entregar a resposta, pergunte-se: \"esse tempo é só da ida ou da ida e volta?\". No radar, é sempre da ida e volta.</i></p>"}},{"id":"c-reflexao-1-403","type":"reflexao","props":{"title":"Para refletir","question":"E se um novo pulso sair antes de o eco do pulso anterior ter voltado, de um alvo distante? O receptor consegue saber a qual pulso aquele eco pertence? O que isso sugere sobre a escolha da PRF?","body":"","tone":"sage","icon":""}},{"id":"c-title-1-008","type":"titulo","props":{"text":"6 Efeito Doppler: o que o eco conta sobre o movimento","level":"h2"}},{"id":"c-prose-1-026","type":"prose","props":{"body":"<p>Você já ouviu a sirene de uma ambulância passar na Avenida Beira-Mar ou na Ipiranga, em Porto Alegre? O som é agudo enquanto ela se aproxima e fica mais grave no instante em que passa e se afasta. A sirene em si não mudou de tom: quem mudou foi a sua posição em relação a ela. É o <strong>efeito Doppler</strong>, a variação aparente da frequência de uma onda quando fonte e observador se movem um em relação ao outro. O mesmo fenômeno vale para ondas eletromagnéticas, e é por isso que um radar consegue dizer não só <em>onde</em> o alvo está, mas <em>como ele se move</em>.</p><p>No radar, a lógica é a da sirene, com uma diferença importante. O sensor emite uma onda numa frequência conhecida; ela bate no alvo e volta. Se a frequência que retorna é maior que a emitida, o alvo \"empurrou\" a frente de onda, ou seja, está se aproximando do receptor. Se é menor, está se afastando (Rafael S. Bittencourt. Radares, p. 6). O <strong>desvio Doppler</strong> é a diferença entre as duas frequências, e a relação que o liga ao movimento é:</p><p></p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cjwjnwnv","type":"equacao","props":{"latex":"Δf = 2·vr·f / c","number":"(4)","showNumber":true,"ariaLabel":"","size":130,"autoFit":true,"framed":false}},{"id":"cv92firn","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">Em que<b><i> Δf</i></b> é o desvio de frequência, <i><b>vr</b></i> é a velocidade radial do alvo, <b><i>f </i></b>é a frequência emitida e <b><i>c </i></b>é a velocidade da luz. Isolando a velocidade, </span></p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cqo6merw","type":"equacao","props":{"latex":"vr = Δf·c / (2·f)","number":"(5)","showNumber":true,"ariaLabel":"","size":130,"autoFit":true,"framed":false}},{"id":"cik6g43q","type":"prose","props":{"body":"<p><span style=\"text-wrap-mode: initial;\">(Rafael S. Bittencourt. Radares, p. 7). Repare no fator<i><b> 2</b></i>. Ele aparece pelo mesmo motivo que apareceu na medida de distância: o sinal faz o caminho de ida e volta, então o alvo \"sente\" o deslocamento uma vez ao receber a onda e o radar \"sente\" de novo ao receber o eco. Na sirene não há esse fator, porque o som vai só da fonte ao ouvido.</span></p><p>Vamos a um número para fixar a ordem de grandeza. Um alvo se aproximando a 10 m/s, observado por um radar em banda X, com<i><b> f = 10 GHz (λ ≈ 3 cm)</b></i>: </p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cs0aa3gv","type":"equacao","props":{"latex":"Δf = \\frac{2 · 10 · 10×10⁹}{3×10⁸} ≈ 667 Hz","number":"(6)","showNumber":true,"ariaLabel":"","size":100,"autoFit":true,"framed":false}},{"id":"ciuxres0","type":"prose","props":{"body":"<p>Dá para perceber que o desvio é minúsculo perto da frequência emitida (667 Hz contra 10 bilhões de Hz), e mesmo assim é perfeitamente mensurável. Medir uma diferença tão pequena sobre uma portadora tão alta é um dos truques que a eletrônica de radar domina bem.</p><p>E como isso se manifesta na superfície do mar? O mar também se move, e o eco carrega essa informação. Segundo Maul, ainda nos anos 1950 o pesquisador D. D. Crombie teria observado, com um radar instalado em terra, que o eco vindo do mar aparecia deslocado em frequência em relação ao sinal transmitido. Em 1972, D. E. Barrick teria confirmado teoricamente que esse deslocamento era um efeito Doppler causado pela velocidade de fase das ondas da superfície (G.A. MAUL. Introduction to satellite oceanography, p. 494). Os nomes, as datas e a página são <strong>a conferir</strong> na obra original. A superfície do oceano não é um alvo parado: ela é um conjunto de ondas que avançam e recuam, e o eco \"ouve\" esse movimento. Guarde a ideia e deixe a aplicação para quando você tiver o vocabulário completo, porque aqui nos interessa o princípio: frequência do eco diferente da emitida significa movimento relativo.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-figure-w1-f9","type":"imagem","props":{"src":"assets/images/aula-01-image-008.svg","slotId":"figure-w1-f9","caption":"Frentes de onda de uma fonte em movimento: compressão à frente, esticamento atrás, e a componente radial da velocidade que governa o desvio.","credit":"Ilustração criada por IA (Claude, Anthropic)","alt":"fonte em movimento para a direita emitindo frentes de onda circulares concêntricas deslocadas, mais juntas à frente da fonte e mais espaçadas atrás; um observador à frente e outro atrás; um vetor de velocidade da fonte decomposto em componente radial (na direção do observador) e componente tangencial, com a radial destacada e rotulada vr","ratio":"16/9"}},{"id":"c-resource-bridge-1-052","type":"prose","props":{"body":"","dropcap":false,"dropcapTone":"terracotta","inlineVideo":{"id":"78WkQObqp3U","title":"O Efeito Doppler Explicado","caption":"Apoio à analogia da sirene antes da fórmula do desvio Doppler&nbsp;","credit":"Ciência Todo Dia · Ciência Todo Dia","start":""}}},{"id":"c-atencao-1-501","type":"atencao","props":{"title":"Atenção","body":"<p><i>O Doppler mede apenas a componente radial da velocidade, a que está na direção da linha que liga o radar ao alvo. Um alvo que passa exatamente perpendicular ao feixe, mesmo em alta velocidade, produz desvio nulo. O erro de quem está começando é ler <b>Δf </b>como \"a velocidade do alvo\", quando ele é só a projeção dessa velocidade na linha de visada.</i></p>","tone":"terracotta","icon":""}},{"id":"c-reflexao-1-502","type":"reflexao","props":{"title":"Para refletir (não vale nota)","question":"Num dia de ressaca em Cidreira ou Tramandaí, as ondas chegam à praia em direção quase perpendicular à costa. Se um radar apontasse paralelo à linha de costa, o que você esperaria do desvio Doppler vindo dessas ondas? E se apontasse de frente para o mar?","body":"","tone":"lavender","icon":""}},{"id":"c-title-1-009","type":"titulo","props":{"text":"7 Antena, equação do radar e a escala em decibéis","level":"h2"}},{"id":"c-prose-1-027","type":"prose","props":{"body":"<p>Uma dúvida comum, em sala, é por que dois radares com a mesma potência de transmissão podem \"ver\" alvos tão diferentes: um mal distingue um barco a dez quilômetros, o outro acompanha o mesmo barco com folga. A resposta passa pela <strong>antena</strong> e por uma relação que junta tudo o que vimos até aqui: a equação do radar. Vamos por partes, sem dedução, só interpretando cada pedaço.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-figure-w1-f10","type":"imagem","props":{"src":"assets/images/aula-01-image-009.svg","slotId":"figure-w1-f10","caption":"Diagrama de radiação de uma antena: lóbulo principal, lóbulos laterais e largura do feixe.&nbsp;","credit":"Ilustração criada por IA (Claude, Anthropic)","alt":"diagrama de radiação de antena em coordenadas polares: um lóbulo principal estreito apontando para cima, vários lóbulos laterais menores nos lados e na parte de trás, com a largura do feixe indicada como o ângulo entre os pontos de meia potência, e o eixo do feixe rotulado","ratio":"16/9"}},{"id":"c-subtitle-1-062","type":"titulo","props":{"text":"7.1 Antena: concentrar a energia numa direção","level":"h3"}},{"id":"c-subprose-1-064","type":"prose","props":{"body":"<p>Uma antena não irradia igualmente para todos os lados. Ela concentra a energia em certas direções, e essa capacidade tem nome: <strong>ganho</strong> (<i><b>G</b></i>). Quanto maior o ganho, mais estreito tende a ser o feixe e maior a potência recebida de alvos nessa direção (Rafael S. Bittencourt. Radares, p. 16). Pense na diferença entre uma lâmpada pendurada no teto e uma lanterna de foco fechado: a mesma energia, aplicada de modo diferente, ilumina um ponto distante com intensidades muito distintas. A região de máxima concentração é o <strong>lóbulo principal</strong>; a energia que \"vaza\" para outras direções forma os <strong>lóbulos laterais</strong>, e a abertura do lóbulo principal define a <strong>largura do feixe</strong>. Maul mostra, como exemplo de feixe muito estreito, o diagrama da antena do radar AN/FPQ-6, usado pelo U.S. Naval Research Laboratory, redesenhado a partir de Skolnik (1970) (G.A. MAUL. Introduction to satellite oceanography, p. 418); a identificação do radar, do usuário e da fonte original é <strong>a conferir</strong> na obra. Ele também lembra que o diagrama da antena ao transmitir é idêntico ao dela ao receber, e é essa simetria que permite usar a mesma antena nas duas tarefas.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-063","type":"titulo","props":{"text":"7.2 A equação do radar, termo a termo","level":"h3"}},{"id":"c-subprose-1-065-p0","type":"prose","props":{"body":"<p>A <strong>equação do radar</strong> relaciona a potência que volta à antena (<b><i>Pr</i></b>) com a potência transmitida (<b><i>Pt)</i></b> e com os fatores que atuam no caminho. Na forma apresentada por Bittencourt, ela envolve o comprimento de onda<b style=\"\"> <i>λ</i></b>, o ganho <i><b>G</b></i>, o coeficiente de retroespalhamento <b><i>σ⁰</i></b>, a área iluminada <b><i>A</i></b>, a eficiência do sistema <i><b>η</b></i> e a distância <i><b>R</b></i> (Rafael S. Bittencourt. Radares, p. 15). Sem escrever a fórmula inteira, vale ler o que cada termo diz:</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"cov51mnl","type":"equacao","props":{"latex":"P_{r} = \\frac{\\lambda ^{2}G^{2}P_{t}\\sigma ^{0}A} {\\left( 4\\pi  \\right)^{3} \\eta R^{4}}","number":"(7)","showNumber":true,"ariaLabel":"","size":130,"autoFit":true,"framed":false}},{"id":"c-subprose-1-065-t0","type":"tabela","props":{"caption":"Equação do Radar","fonte":"Rafael S. Bittencourt. Radares, p. 15","striped":true,"destacarPrimeira":true,"compact":false,"headers":["Termo","Papel na potência recebida"],"rows":[["<i>Pt </i>(potência transmitida)","Mais potência emitida, mais eco"],["<i>G² </i>(ganho ao quadrado)","Aparece duas vezes porque a mesma antena transmite e recebe (Bittencourt, p. 16)"],["<i>λ²</i> (comprimento de onda)","A banda escolhida altera a potência recebida"],["<i>σ⁰</i> e <i>A</i>","Quanto da energia o alvo devolve (<b><i>σ⁰</i></b>) e qual área foi iluminada (<b><i>A</i></b>)"],["<i>R⁴</i> (distância à quarta)","Pequena variação na distância muda muito a potência (Bittencourt, p. 16)"]]}},{"id":"c-subprose-1-065-p1","type":"prose","props":{"body":"<p>O termo que mais pega de surpresa é o <b><i>R⁴</i></b>: a potência cai com a distância elevada à quarta potência, não ao quadrado. A energia se espalha na ida e se espalha de novo na volta, e esses dois enfraquecimentos se multiplicam. Dobrar a distância reduz a potência recebida a 1/16. Por isso Maul destaca que, uma vez projetado o sistema, só o σ (seção reta efetiva do alvo) e o <b><i>R⁴</i></b> são variáveis geofísicas capazes de alterar a relação sinal-ruído (G.A. MAUL. Introduction to satellite oceanography, p. 406); a formulação exata dessa passagem é <strong>a conferir</strong> na obra.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-subtitle-1-064","type":"titulo","props":{"text":"7.3 <i>σ⁰</i> e a escala em decibéis","level":"h3"}},{"id":"c-subprose-1-066","type":"prose","props":{"body":"<p>O <strong>coeficiente de retroespalhamento</strong> (<i><b>σ⁰</b></i>) mede a fração da energia incidente que a superfície devolve na direção do radar. A parte do sinal que volta recebe o nome de retroespalhamento (Rafael S. Bittencourt. Radares, p. 19) e depende de rugosidade, ângulo de incidência, propriedades dielétricas e comprimento de onda (p. 20), assunto da Aula 2. Como os valores de potência cobrem muitas ordens de grandeza, trabalha-se com o <strong>decibel</strong> (dB), uma escala logarítmica: dB = 10·log₁₀(Pmedida/Pteórica) (G.A. MAUL. Introduction to satellite oceanography, p. 406). Alguns pontos de referência: 0 dB é razão 1; +10 dB é fator 10; +3 dB é cerca do dobro; −10 dB é um décimo.</p>","dropcap":false,"dropcapTone":"terracotta"}},{"id":"c-destaque-1-601","type":"destaque","props":{"title":"Em uma frase","body":"<p>A potência do eco depende de quanto a antena concentra o feixe, de quão distante está o alvo (com peso <i><b>R⁴</b></i>) e de quanto a superfície devolve (<b><i>σ⁰</i></b>), e tudo isso se lê em decibéis.</p>","tone":"sage","icon":""}},{"id":"c-pitaco-1-602","type":"pitaco","props":{"kicker":"Dica","name":"Rafael S. Bittencourt","role":"","tone":"ocean","src":"assets/images/aula-01-image-001.jpg","slotId":"c-pitaco-1-602","body":"<p><i>Para converter na cabeça, memorize três pares: 3 dB ≈ ×2, 10 dB = ×10 e 20 dB = ×100. Somar decibéis equivale a multiplicar razões, o que torna as contas muito mais leves.</i></p>"}},{"id":"c-atencao-1-603","type":"atencao","props":{"title":"Atenção","body":"<p><b><i>σ⁰</i></b> em <i><b>dB </b></i>costuma aparecer com valores negativos (por exemplo, −20 dB). Isso não significa \"energia negativa\": significa que a razão é menor que 1, ou seja, a superfície devolve uma pequena fração do que recebeu.</p>","tone":"coral","icon":""}},{"id":"c-glossary-1-002","type":"titulo","props":{"text":"Glossário rápido desta aula","level":"h2"}},{"id":"c-accordion-1-002","type":"accordion","props":{"items":[{"title":"Efeito Doppler","body":"<p>variação da frequência de uma onda causada pelo movimento relativo entre fonte e observador; no radar, o desvio entre a frequência emitida e a do eco indica o movimento do alvo.</p>","children":[]},{"title":"Velocidade radial (vr)","body":"<p>componente da velocidade do alvo na direção da linha que o liga ao radar; é a única que produz desvio Doppler.</p>","children":[]},{"title":"Desvio Doppler (Δf)","body":"<p>diferença entre a frequência do eco e a emitida, dada por Δf = 2·vr·f/c.</p>","children":[]},{"title":"Ganho da antena (G)","body":"<p>capacidade de concentrar a energia transmitida e de receber de uma direção específica.</p>","children":[]},{"title":"Lóbulo principal","body":"<p>região de máxima concentração de energia no diagrama de radiação da antena; os lóbulos laterais são as direções secundárias.</p>","children":[]},{"title":"Largura do feixe","body":"<p>abertura angular do lóbulo principal; feixe mais estreito significa maior diretividade.</p>","children":[]},{"title":"Equação do radar","body":"<p>relação entre a potência recebida e a potência transmitida, o ganho, o comprimento de onda, a área iluminada, σ⁰ e a distância (com R⁴).</p>","children":[]},{"title":"Coeficiente de retroespalhamento (σ⁰)","body":"<p>medida da energia que a superfície devolve na direção do radar, normalmente em dB.</p>","children":[]},{"title":"Decibel (dB)","body":"<p>escala logarítmica de razão de potências, dB = 10·log₁₀(Pmedida/Pteórica).</p>","children":[]},{"title":"Relação sinal-ruído (S/N)","body":"<p>razão entre a potência do sinal desejado e a do ruído no receptor.</p>","children":[]},{"title":"Sensor ativo","body":"<p>sensor que produz a própria energia, a lança contra o alvo e registra o que retorna; por isso funciona de dia, de noite e sob nuvem.</p>","children":[]},{"title":"Sensor passivo","body":"<p>sensor que apenas recebe a energia que já existe no ambiente, como a luz do Sol refletida ou o calor emitido pela Terra.</p>","children":[]},{"title":"Micro-ondas","body":"<p>faixa do espectro eletromagnético, com comprimentos de onda de poucos centímetros a algumas dezenas de centímetros, onde operam os radares.</p>","children":[]},{"title":"Frequência (f) e comprimento de onda (λ)","body":"<p>número de ciclos por segundo e distância entre duas cristas, ligados por λ = c/f; frequência alta significa onda curta.</p>","children":[]},{"title":"Bandas de radar (P, L, S, C, X, Ku, K, Ka)","body":"<p>designações alfabéticas, de origem histórica, para faixas de frequência de radar; P e L são as mais longas, Ku, K e Ka as mais curtas.</p>","children":[]},{"title":"Pulso e eco","body":"<p>o pulso é a rajada curta de micro-ondas emitida pelo radar; o eco é a parte dela que o alvo devolve.</p>","children":[]},{"title":"Duplexador","body":"<p>chave que alterna a antena entre transmitir e receber, protegendo o receptor durante a emissão do pulso.</p>","children":[]},{"title":"Distância por tempo de retorno (R = c·t/2)","body":"<p>a distância ao alvo é metade do caminho percorrido pelo pulso, porque o tempo medido inclui ida e volta.</p>","children":[]},{"title":"Efeito Doppler","body":"<p>variação da frequência causada pelo movimento relativo entre fonte e observador; no radar, o desvio entre a frequência emitida e a do eco revela o movimento do alvo.</p>","children":[]},{"title":"Velocidade radial (vr)","body":"<p>componente da velocidade do alvo na direção da linha radar-alvo; é a única que produz desvio Doppler.</p>","children":[]},{"title":"Ganho da antena (G)","body":"<p>capacidade de concentrar a energia transmitida e de receber de uma direção específica.</p>","children":[]},{"title":"Lóbulo principal, lóbulos laterais e largura do feixe","body":"<p>região de máxima concentração de energia da antena, direções secundárias por onde a energia vaza e abertura angular do lóbulo principal, respectivamente.</p>","children":[]},{"title":"Equação do radar","body":"<p>relação entre a potência recebida e a transmitida, o ganho, o comprimento de onda, a área iluminada, σ⁰ e a distância (com R⁴).</p>","children":[]},{"title":"Coeficiente de retroespalhamento (σ⁰)","body":"<p>medida da fração da energia incidente que a superfície devolve na direção do radar, normalmente expressa em dB.</p>","children":[]},{"title":"Decibel (dB)","body":"<p>escala logarítmica de razão de potências, dB = 10·log₁₀(Pmedida/Pteórica).</p>","children":[]},{"title":"Relação sinal-ruído (S/N)","body":"<p>razão entre a potência do sinal desejado e a do ruído no receptor.</p>","children":[]},{"title":"Sea clutter","body":"<p>eco indesejado vindo da superfície do mar, que atrapalhava a detecção de alvos nos radares militares e depois se mostrou correlacionado com o vento.</p>","children":[]}]}}]}},{"id":"b-synthesis-1-001","type":"sintese","bg":"sage-deep","pad":"airy","props":{"eyebrow":"Síntese","title":"A ideia que fecha a aula","body":"<p>Vamos amarrar o fio da aula. Começamos com a pergunta de como \"enxergar\" sem luz e a resposta foi o eco: um pulso de micro-ondas sai da antena, bate no alvo e volta, e o tempo de ida e volta (com o fator 2) entrega a distância. A origem militar do radar, na Segunda Guerra, explica por que a tecnologia existia antes de a oceanografia pensar em usá-la. O ruído que atrapalhava o operador naval, o <em>sea clutter</em>, é o sinal que o oceanógrafo quer medir. As micro-ondas, organizadas em bandas (P, L, S, C, X, Ku, K, Ka) cujas letras são históricas, atravessam nuvens e dispensam o Sol, porque o radar é um sensor ativo, com fonte própria de energia. Esse conforto tem limite: chuva forte em bandas curtas atenua o sinal. O Doppler mostrou que o eco também carrega o movimento relativo do alvo, mas só a componente radial. E a equação do radar juntou tudo numa relação em que a antena (ganho ao quadrado), a distância (R⁴) e o retroespalhamento (σ⁰) decidem quanta potência volta, expressa em decibéis.</p><p>Ao final desta aula, você deve ser capaz de <strong>fazer</strong> o seguinte: converter um tempo de retorno em distância e um desvio Doppler em velocidade radial; relacionar frequência, comprimento de onda e banda; justificar por que o radar observa o mar de dia, de noite e sob nuvem; e ler cada termo da equação do radar, dizendo o que acontece com a potência recebida quando a distância dobra. Ficou de fora, de propósito, o <em>porquê</em> de σ⁰ variar tanto: isso depende de como a superfície do mar responde ao radar.</p><p><strong>Na próxima aula:</strong> O conceito que esta aula passa adiante é o <strong>retroespalhamento (σ⁰)</strong>: a fração de energia que a superfície devolve ao radar, controlada por rugosidade, ângulo de incidência, propriedades dielétricas, comprimento de onda e polarização. A pergunta que fica em aberto é a do litoral gaúcho: por que um mar calmo pode parecer \"escuro\" e um mar agitado \"brilhante\" para o radar, se a água é a mesma? Na Aula 2 você vai encontrar a resposta, começando pela diferença entre reflexão especular e espalhamento difuso e passando pela condição de ressonância de Bragg, pela curva de σ⁰ em função do ângulo de incidência e pelo papel do vento, e depois vai calcular, em duplas, comprimentos de onda de Bragg e a pegada de uma antena em órbita.</p>"}},{"id":"b-references-1-001","type":"referencias","bg":"neutral-default","pad":"normal","props":{"title":"Referências","items":["BITTENCOURT, Rafael S. <strong>Radares</strong>. [S. l.: s. n.], 2026. Material didático (slides).","EUROPEAN SPACE AGENCY. <strong>Echoes in Space:</strong> introduction to radar remote sensing. [S. l.]: EO College, [2019]. Disponível em: https://eo-college.org/lessons/introduction-3. Acesso em: 12 nov. 2026.","HARNEY, Patrick J.; KATZ, Isadore. Radar meteorology at Radiation Laboratory, MIT, 1941 to 1947. In: ATLAS, David (ed.). <strong>Radar in meteorology</strong>. Boston: American Meteorological Society, 1990.","MARTIN, Seelye. <strong>An Introduction to Ocean Remote Sensing</strong>. 2. ed. Cambridge: Cambridge University Press, 2014.","MAUL, G. A. <strong>Introduction to satellite oceanography</strong>.Dordrecht: Martinus Nijhoff, 1985. (Remote sensing of earth resources and environment, v. 3).","NASA EARTHDATA. <strong>What is remote sensing?&lt;/strong) Washington, DC</strong>: NASA, [20--], [ano]. Disponível em: https://earthdata.nasa.gov/learn/earth-observation-data-basics/remote-sensing. Acesso em: 12 nov. 2026.","REES, W. G. <strong>Physical Principles of Remote Sensing</strong>. 3. ed. Cambridge: Cambridge University Press, 2013.","ROBINSON, Ian S. <strong>Discovering the Ocean from Space</strong>: the unique applications of satellite oceanography. Berlin: Springer; Chichester: Praxis, 2010.\n","WOODHOUSE, Iain H. <strong>Introduction to Microwave Remote Sensing</strong>. Boca Raton: CRC Press, 2006.","RIDENOUR, Louis N. Radar in war and peace. Electrical Engineering, [New York], v. 65, n. 5, p. 202-207, maio 1946."]}},{"id":"b-credit-01","type":"topic","bg":"neutral-default","pad":"normal","props":{"children":[{"id":"c-credit-01","type":"prose","props":{"body":"<p style=\"text-align:center;font-size:.85em;opacity:.8\">Conteúdo elaborado com <strong>ClassAuthor</strong>, uma ferramenta de planejamento pedagógico desenvolvida por Rogério Bittencourt, INOVALAB - IFSC.</p>","dropcap":false}}]}}]}
</script>

function waitForPrintableAssets() {
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  const images = Array.from(document.images).map(function (img) {
    if (img.complete) return Promise.resolve();
    return new Promise(function (resolve) {
      img.addEventListener("load", resolve, { once: true });
      img.addEventListener("error", resolve, { once: true });
    });
  });
  return Promise.all([fonts].concat(images)).then(function () {
    return new Promise(function (resolve) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { setTimeout(resolve, 500); });
      });
    });
  });
}

function openPrintVersion() {
  const url = new URL(location.href);
  url.searchParams.set("pdf", "1");
  url.searchParams.set("print", "1");
  window.open(url.href, "_blank", "noopener");
}
