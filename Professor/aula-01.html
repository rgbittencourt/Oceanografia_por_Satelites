<script>
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <script src="image-slot.js"><\/script>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +
    '  transition:border-color .12s}' +
    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.
    '.ctl{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:8px;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so
      // disconnect/reconnect (e.g. React remount) doesn't stack handlers.
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      // naturalWidth/Height aren't known until load — re-apply so the cover
      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());
      // Gated on editable + fit=cover so share links and contain/fill slots
      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();
        this._applyView();
      }, { passive: false });
    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);
      load();
      this._render();
    }

    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

</script>
<script>
/* Aula — SCORM bridge
 * Minimal, dependency-free connector that talks to a Moodle SCORM
 * runtime (SCORM 2004 / API_1484_11 first, falling back to 1.2 / API).
 *
 * Exposes window.AulaSCORM with:
 *   .available        boolean — was an LMS API found?
 *   .init()           call once on load (LMSInitialize / Initialize)
 *   .setProgress(p)   p in 0..1 — best-effort progress_measure
 *   .complete()       mark completed + passed, commit, return true on success
 *   .exit()           terminate the session
 *
 * If no LMS API is present (e.g. previewing the HTML directly), every
 * method degrades gracefully and complete() returns false — the UI
 * still shows its "concluída" state so authors can preview the flow.
 */
(function () {
  "use strict";

  var api = null;     // the discovered API object
  var version = null; // "2004" | "1.2"
  var started = false;

  // Walk up the window hierarchy (incl. opener) looking for an API.
  function findAPI(win, names) {
    var tries = 0;
    while (win && tries < 12) {
      try {
        for (var i = 0; i < names.length; i++) {
          if (win[names[i]]) return { obj: win[names[i]], name: names[i] };
        }
      } catch (e) {
        // Cross-origin parent (e.g. design preview) — can't read it; stop walking up.
        return null;
      }
      if (win.parent && win.parent !== win) { win = win.parent; tries++; }
      else break;
    }
    return null;
  }

  function discover() {
    if (api) return api;
    var found = findAPI(window, ["API_1484_11"]); // SCORM 2004
    if (found) { api = found.obj; version = "2004"; return api; }
    found = findAPI(window, ["API"]);             // SCORM 1.2
    if (found) { api = found.obj; version = "1.2"; return api; }
    // Try the opener window (Moodle sometimes launches in a popup)
    if (window.opener) {
      try {
        found = findAPI(window.opener, ["API_1484_11"]);
        if (found) { api = found.obj; version = "2004"; return api; }
        found = findAPI(window.opener, ["API"]);
        if (found) { api = found.obj; version = "1.2"; return api; }
      } catch (e) { /* cross-origin opener — ignore */ }
    }
    return null;
  }

  function call(fn2004, fn12, arg1, arg2) {
    var a = discover();
    if (!a) return "";
    try {
      if (version === "2004") return arg2 !== undefined ? a[fn2004](arg1, arg2) : (arg1 !== undefined ? a[fn2004](arg1) : a[fn2004](""));
      return arg2 !== undefined ? a[fn12](arg1, arg2) : (arg1 !== undefined ? a[fn12](arg1) : a[fn12](""));
    } catch (e) { return ""; }
  }

  function setValue(el2004, el12, val) {
    var a = discover();
    if (!a) return false;
    try {
      var result = version === "2004" ? a.SetValue(el2004, val) : a.LMSSetValue(el12, val);
      return result === "true" || result === true;
    } catch (e) { return false; }
  }

  function getValue(el2004, el12) {
    var a = discover();
    if (!a) return "";
    try {
      return version === "2004" ? a.GetValue(el2004) : a.LMSGetValue(el12);
    } catch (e) { return ""; }
  }

  function commit() {
    var a = discover();
    if (!a) return false;
    try {
      var result = version === "2004" ? a.Commit("") : a.LMSCommit("");
      return result === "true" || result === true;
    } catch (e) { return false; }
  }

  var AulaSCORM = {
    get available() { return !!discover(); },
    get version() { return version; },

    init: function () {
      var a = discover();
      if (!a || started) return started;
      try {
        var r = version === "2004" ? a.Initialize("") : a.LMSInitialize("");
        started = (r === "true" || r === true);
        if (started && version === "2004") {
          // Only initialize a new attempt. Never downgrade a completed session
          // when the learner reopens the SCO.
          var status = getValue("cmi.completion_status", null);
          if (!status || status === "unknown" || status === "not attempted") {
            setValue("cmi.completion_status", null, "incomplete");
          }
        }
      } catch (e) { started = false; }
      return started;
    },

    setProgress: function (p) {
      if (!discover()) return false;
      var clamped = Math.max(0, Math.min(1, p || 0));
      if (version === "2004") {
        setValue("cmi.progress_measure", null, String(clamped));
      } else {
        // 1.2 has no native progress; stash in a suspend-friendly slot
        setValue(null, "cmi.core.lesson_location", String(Math.round(clamped * 100)));
      }
      return commit();
    },

    complete: function () {
      if (!discover()) return false;
      if (!started) this.init();
      var ok = false;
      if (version === "2004") {
        ok = setValue("cmi.completion_status", null, "completed");
        setValue("cmi.success_status", null, "passed");
        setValue("cmi.progress_measure", null, "1");
      } else {
        ok = setValue(null, "cmi.core.lesson_status", "completed");
      }
      commit();
      return ok;
    },

    // Report a graded score on a 0–10 scale (Aula convention for avaliativo quizzes).
    //   nota10  — the learner's grade from 0 to 10
    //   passed  — boolean; if omitted, defaults to nota10 >= 6
    // Sets the 0–10 raw score with min 0 / max 10 on both SCORM versions,
    // plus the normalized scaled score (0–1) required by SCORM 2004.
    score: function (nota10, passed) {
      if (!discover()) return false;
      if (!started) this.init();
      var nota = Math.max(0, Math.min(10, Number(nota10) || 0));
      var ok = (typeof passed === "boolean") ? passed : nota >= 6;
      if (version === "2004") {
        setValue("cmi.score.min", null, "0");
        setValue("cmi.score.max", null, "10");
        setValue("cmi.score.raw", null, String(nota));
        setValue("cmi.score.scaled", null, String(nota / 10)); // 0–1, required by 2004
        setValue("cmi.success_status", null, ok ? "passed" : "failed");
        setValue("cmi.completion_status", null, "completed");
      } else {
        // SCORM 1.2 score range is 0–100 by spec; Moodle scales it back to the
        // activity's max grade. We report the 0–10 value with explicit min/max.
        setValue(null, "cmi.core.score.min", "0");
        setValue(null, "cmi.core.score.max", "10");
        setValue(null, "cmi.core.score.raw", String(nota));
        setValue(null, "cmi.core.lesson_status", ok ? "passed" : "failed");
      }
      commit();
      return true;
    },

    exit: function () {
      var a = discover();
      if (!a || !started) return false;
      try {
        if (version === "2004") { a.SetValue("cmi.exit", "normal"); a.Commit(""); a.Terminate(""); }
        else { a.LMSCommit(""); a.LMSFinish(""); }
        started = false;
        return true;
      } catch (e) { return false; }
    },
  };

  // Auto-init on load and terminate on unload — the standard SCORM lifecycle.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { AulaSCORM.init(); });
  } else {
    AulaSCORM.init();
  }
  window.addEventListener("unload", function () { try { AulaSCORM.exit(); } catch (e) {} });

  window.AulaSCORM = AulaSCORM;
})();

</script>
<script>
/* ============================================================
   Aula — Glossário
   Wires the .termo glossary popovers. Click (or Enter/Space on
   the focused <button>) toggles the definition; Escape or a
   click outside closes it. Only one term is open at a time.
   Self-contained, no dependencies — drop the <script> anywhere
   after the .termo markup (it also handles nodes added later).
   ============================================================ */
(function () {
  "use strict";

  function closeAll(except) {
    document.querySelectorAll('.termo[aria-expanded="true"]').forEach(function (t) {
      if (t !== except) {
        t.setAttribute("aria-expanded", "false");
        t.classList.remove("termo--below");
      }
    });
  }

  // Flip the popover below the term when there isn't room above.
  function place(t) {
    var pop = t.querySelector(".termo__pop");
    if (!pop) return;
    t.classList.remove("termo--below");
    var rect = t.getBoundingClientRect();
    var needed = pop.offsetHeight + 28;
    if (rect.top < needed) t.classList.add("termo--below");
  }

  document.addEventListener("click", function (e) {
    var target = e.target;
    // Don't hijack clicks while the author is editing text in the builder
    // (the .termo is just dotted-underline text there; clicking should edit).
    if (target.closest && target.closest('[contenteditable="true"]')) return;
    // clicks inside an open definition shouldn't toggle it
    if (target.closest && target.closest(".termo__pop")) return;

    var t = target.closest && target.closest(".termo");
    if (t) {
      var isOpen = t.getAttribute("aria-expanded") === "true";
      closeAll(t);
      if (isOpen) {
        t.setAttribute("aria-expanded", "false");
        t.classList.remove("termo--below");
      } else {
        t.setAttribute("aria-expanded", "true");
        place(t);
      }
      e.stopPropagation();
      return;
    }
    closeAll(null);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeAll(null);
      return;
    }
    // span[role=button] doesn't fire click on Enter/Space — do it here
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      var t = e.target.closest && e.target.closest(".termo");
      if (t) {
        e.preventDefault();
        t.click();
      }
    }
  });

  // Re-flip open popovers if the viewport changes.
  window.addEventListener(
    "resize",
    function () {
      document.querySelectorAll('.termo[aria-expanded="true"]').forEach(place);
    },
    { passive: true }
  );
})();

</script>
<script>
/* ClassAtelier — bloco «Equação».
 * Componente global (sem Babel) usado pelo editor e pelas aulas exportadas.
 * A fórmula é escrita em LaTeX e desenhada pelo KaTeX (vendor/katex/), que também gera MathML
 * para leitores de tela. Layout: fórmula centralizada, dentro de uma caixa com borda visível;
 * o número fica na extremidade direita da mesma linha, FORA da caixa.
 */
(function () {
  var KATEX_OPTS = { displayMode: true, throwOnError: true, output: "htmlAndMathml", strict: "ignore", trust: false, maxExpand: 1000, maxSize: 40 };

  var CSS = [
    ".aula-eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:16px;margin:.4em 0;max-width:100%}",
    ".aula-eq__box{grid-column:2;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;border:1.5px solid var(--ink,#1B1A17);border-radius:6px;padding:.55em 1.1em;text-align:center;background:transparent}",
    ".aula-eq--plain .aula-eq__box{border:0;padding-left:.4em;padding-right:.4em;border-radius:0}",
    ".aula-eq__math{line-height:1.3;white-space:nowrap}",
    ".aula-eq .katex-display{margin:0;overflow:visible}",
    ".aula-eq .katex-mathml{position:absolute!important;clip:rect(1px,1px,1px,1px);padding:0!important;border:0!important;height:1px!important;width:1px!important;overflow:hidden}",
    ".aula-eq .katex-display>.katex{white-space:nowrap}",
    ".aula-eq__num{grid-column:3;justify-self:end;font-variant-numeric:tabular-nums;font-size:1em;color:var(--ink,#1B1A17);white-space:nowrap;min-width:2ch;text-align:right}",
    ".aula-eq__err{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#9a2f1b;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}",
    ".aula-eq__err b{display:block;font-family:inherit;margin-bottom:2px}",
    "@media (max-width:560px){.aula-eq{grid-template-columns:minmax(0,1fr);row-gap:4px}.aula-eq__box{grid-column:1;justify-self:center}.aula-eq__num{grid-column:1;justify-self:end}}",
    "@media print{.aula-eq__box{border-color:#000;overflow:visible}.aula-eq--plain .aula-eq__box{border:0}.aula-eq{break-inside:avoid}}"
  ].join("\n");

  function injectCss() {
    if (document.getElementById("aula-equacao-css")) return;
    var st = document.createElement("style"); st.id = "aula-equacao-css"; st.textContent = CSS;
    document.head.appendChild(st);
  }
  injectCss();

  // Devolve { html } ou { error }. Nunca lança.
  function renderEquation(latex) {
    var src = String(latex == null ? "" : latex).trim();
    if (!src) return { empty: true };
    if (!window.katex) return { loading: true };
    try { return { html: window.katex.renderToString(src, KATEX_OPTS) }; }
    catch (e) { return { error: String((e && e.message) || e).replace(/^KaTeX parse error:\s*/i, "") }; }
  }

  // Número seguinte ao anterior, mantendo o formato: "(1)" → "(2)", "(1.1)" → "(1.2)", "Eq. 3" → "Eq. 4".
  function nextEquationNumber(prev, count) {
    var plain = String(prev == null ? "" : prev).replace(/<[^>]+>/g, "").trim();
    var m = /(\d+)(?!.*\d)/.exec(plain);
    if (!m) return "(" + ((count || 0) + 1) + ")";
    return plain.slice(0, m.index) + (parseInt(m[1], 10) + 1) + plain.slice(m.index + m[1].length);
  }

  // Todas as equações do documento, em ordem de leitura (percorre blocos aninhados).
  function listEquations(blocks) {
    var out = [];
    (function walk(o) {
      if (!o || typeof o !== "object") return;
      if (Array.isArray(o)) { for (var i = 0; i < o.length; i++) walk(o[i]); return; }
      if (o.type === "equacao" && o.props) out.push(o);
      for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k) && o[k] && typeof o[k] === "object") walk(o[k]);
    })(blocks);
    return out;
  }

  // Dá número às equações recém-criadas (props.autoNumber), seguindo a anterior no texto. Devolve o mesmo
  // objeto se nada mudou. `force` renumera TODAS em sequência, a partir da primeira.
  function autoNumberEquations(lesson, force) {
    if (!lesson || !lesson.blocks) return lesson;
    var eqs = listEquations(lesson.blocks);
    var need = force || eqs.some(function (e) { return e.props.autoNumber; });
    if (!need) return lesson;
    var next = JSON.parse(JSON.stringify(lesson));
    var list = listEquations(next.blocks), prev = null;
    list.forEach(function (e, i) {
      if (i > 0 && (force || e.props.autoNumber)) e.props.number = nextEquationNumber(prev, i);
      else if (i === 0 && e.props.autoNumber) e.props.number = e.props.number || "(1)";
      delete e.props.autoNumber;
      prev = e.props.number;
    });
    return next;
  }

  function Equacao(props) {
    var h = React.createElement;
    var useState = React.useState, useEffect = React.useEffect;
    var tick = useState(0), setTick = tick[1];
    var r = renderEquation(props.latex);
    // O KaTeX pode chegar depois (CDN): tenta de novo por alguns segundos.
    useEffect(function () {
      if (!r.loading) return;
      var n = 0, t = setInterval(function () { n++; if (window.katex || n > 40) { clearInterval(t); setTick(function (x) { return x + 1; }); } }, 250);

// Hook compartilhado: progresso de rolagem da página (0–100)
function useScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setProgress(max > 0 ? Math.min(100, Math.max(0, (h.scrollTop / max) * 100)) : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return progress;
}

// TOP BAR — sticky progress + lesson title + toolbar
function TopBar({ lessonTitle, chapter }) {
  const progress = useScrollProgress();
  return (
    <header className="aula-topbar">
      <div className="aula-topbar__progress" style={{ width: `${progress}%` }}></div>
      <div className="aula-topbar__row">
        <a href="#" className="aula-topbar__brand" aria-label="ClassAtelier">
          <img src="assets/classatelier-mark.svg" alt="" width="24" height="24" />
          <span className="aula-topbar__word">Class<i style={{ fontFamily: "Newsreader, Georgia, serif", fontWeight: 400 }}>Atelier</i></span>
        </a>
        <div className="aula-topbar__crumbs">
          <span className="aula-topbar__chapter">{chapter}</span>
          <span className="aula-topbar__sep">·</span>
          <span className="aula-topbar__lesson">{lessonTitle}</span>
        </div>
        <div className="aula-topbar__tools">
          <ToolbarButton icon="type" label="Tipografia" />
          <ToolbarButton icon="sun" label="Contraste" />
          <ToolbarButton icon="bookmark" label="Salvar" />
          <ToolbarButton icon="share" label="Compartilhar" />
        </div>
      </div>
    </header>
  );
}
function ToolbarButton({ icon, label }) {
  return (
    <button type="button" className="aula-topbar__btn" title={label} aria-label={label}>
      <Icon name={icon} size={18} stroke={1.6} color="var(--ink-soft)" />
    </button>
  );
}

// Usado no lugar do TopBar dentro de SCORM/Moodle.
function ProgressBar() {
  if (usePDF()) return null; // no reading-progress chrome on paper
  const progress = useScrollProgress();
  return (
    <div className="aula-progressbar" aria-hidden="true">
      <div className="aula-progressbar__fill" style={{ width: `${progress}%` }}></div>
    </div>
  );
}

// painel lateral com as seções da aula (auto-detectadas dos <h2>

  const [items, setItems] = useState([]);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(null);

  // Discover sections in document order: ChapterDivider labels become
  // group headers, <h2> headings become numbered items beneath them.
  useEffect(() => {
    const root = document.querySelector(scope) || document.body;
    const slug = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "").slice(0, 50);
    const collect = () => {
      const used = {};
      const nodes = [...root.querySelectorAll("h2, [data-toc-section], [data-toc-item]")];
      const list = [];
      nodes.forEach((node) => {
        const isSection = node.matches("[data-toc-section]");
        const labelEl = isSection ? node.querySelector("[data-toc-label]") : node;
        // A node may override its index label via data-toc-text (e.g. Síntese,
        // whose visible <h2> is a full sentence but should read "Para fechar"
        // in the Sumário). Falls back to the element's own text content.
        const override = (node.getAttribute("data-toc-text") || "").trim();
        const text = override || (labelEl ? labelEl.textContent.trim() : "");
        if (!text) return;
        const anchor = node; // scroll target is the node itself
        if (!anchor.id) {
          let base = slug(text) || "secao";
          used[base] = (used[base] || 0) + 1;
          anchor.id = used[base] > 1 ? `${base}-${used[base]}` : base;
        }
        anchor.style.scrollMarginTop = "56px"; // clear the progress bar on jump
        list.push({ id: anchor.id, text, el: anchor, level: isSection ? "group" : "item" });
      });
      setItems(list);
      return list;
    };
    const list = collect();
    // Re-scan once more after late content (images/embeds) settle.
    const t = setTimeout(collect, 600);

    if (!("IntersectionObserver" in window) || !list.length) return () => clearTimeout(t);
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
      },
      { rootMargin: "-10% 0px -75% 0px", threshold: 0 }
    );
    list.forEach((it) => io.observe(it.el));
    return () => { clearTimeout(t); io.disconnect(); };
  }, [scope]);

  // Esc closes the panel.
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open]);

  const go = (id) => {
    const el = document.getElementById(id);
    // scrollIntoView rola o contêiner certo: a janela na aula exportada e o painel
    // de rolagem do editor no modo Visualizar (scrollMarginTop já afasta da barra).
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    setOpen(false);
  };

  if (!items.length) return null;

  return (
    <React.Fragment>
      <button
        type="button"
        className="aula-sumario__fab"
        aria-label={open ? "Fechar sumário" : "Abrir sumário"}
        aria-expanded={open}
        onClick={() => setOpen((v) => !v)}
        data-pdf-hide=""
      >
        <Icon name={open ? "x" : "list"} size={20} stroke={2} color="var(--paper)" />
      </button>

      <div
        className={"aula-sumario__backdrop" + (open ? " is-open" : "")}
        onClick={() => setOpen(false)}
        aria-hidden="true"
        data-pdf-hide=""
      ></div>

      <nav
        className={"aula-sumario__panel" + (open ? " is-open" : "")}
        aria-label={label}
        data-pdf-hide=""
      >
        <div className="aula-sumario__head">
          <Icon name="list" size={16} stroke={2} color="var(--ink-mute)" />
          <span>{label}</span>
        </div>
        <ol className="aula-sumario__list">
          {(() => {
            let n = 0;
            return items.map((it) => {
              const on = active === it.id;
              if (it.level === "group") {
                return (
                  <li key={it.id}>
                    <button type="button" onClick={() => go(it.id)}
                      className={"aula-sumario__group" + (on ? " is-active" : "")}>
                      {it.text}
                    </button>
                  </li>
                );
              }
              n += 1;
              const num = n;
              return (
                <li key={it.id}>
                  <button type="button" onClick={() => go(it.id)}
                    className={"aula-sumario__item" + (on ? " is-active" : "")}>
                    <span className="aula-sumario__num">{String(num).padStart(2, "0")}</span>
                    <span className="aula-sumario__text">{it.text}</span>
                  </button>
                </li>
              );
            });
          })()}
        </ol>
      </nav>
    </React.Fragment>
  );
}

// FULL-BLEED SECTION — 100vw colored band. New documents persist structural
// surface IDs from the active theme; legacy color names remain readable.
function FullBleedSection({ tone = "paper", children, py = "clamp(56px,8vw,96px)" }) {
  const legacy = {
    paper: { cssVar: "--paper", contentTone: "dark" },
    sand: { cssVar: "--sand", contentTone: "dark" },
    sage: { cssVar: "--sage-soft", contentTone: "dark" },
    lavender: { cssVar: "--lavender-soft", contentTone: "dark" },
    coral: { cssVar: "--coral-soft", contentTone: "dark" },
    ocean: { cssVar: "--ocean-soft", contentTone: "dark" },
    marigold: { cssVar: "--marigold-soft", contentTone: "dark" },
    "terracotta-soft": { cssVar: "--terracotta-soft", contentTone: "dark" },
    "marigold-vivid": { cssVar: "--marigold", contentTone: "dark" },
    "lavender-vivid": { cssVar: "--lavender", contentTone: "light" },
    "coral-vivid": { cssVar: "--coral", contentTone: "dark" },
    ink: { cssVar: "--ink", contentTone: "light" },
    petrol: { cssVar: "--ocean-deep", contentTone: "light" },
    "ocean-vivid": { cssVar: "--ocean", contentTone: "light" },
    terracotta: { cssVar: "--terracotta", contentTone: "dark" },
    "terracotta-deep": { cssVar: "--terracotta-deep", contentTone: "light" },
    "coral-deep": { cssVar: "--coral-deep", contentTone: "light" },
    "marigold-deep": { cssVar: "--marigold-deep", contentTone: "dark" },
    "sage-deep": { cssVar: "--sage-deep", contentTone: "light" },
    "sage-green": { cssVar: "--sage", contentTone: "dark" },
    "lavender-deep": { cssVar: "--lavender-deep", contentTone: "light" },
  };
  const theme = window.AULA_ACTIVE_THEME || {};
  const resolvedTone = (theme.topicSurfaceAliases && theme.topicSurfaceAliases[tone]) || tone;
  const surfaces = theme.topicSurfaces || [];
  const structuralFallback = {
    "neutral-default": "paper", "neutral-subtle": "sand", "neutral-inverse": "ink",
    "accent-1-soft": "marigold", "accent-2-soft": "terracotta-soft", "accent-3-soft": "lavender",
    "accent-4-soft": "sage", "accent-5-soft": "ocean", "accent-6-soft": "coral",
    "accent-1-vivid": "marigold-vivid", "accent-2-vivid": "terracotta", "accent-3-vivid": "lavender-vivid",
    "accent-4-vivid": "sage-green", "accent-5-vivid": "ocean-vivid", "accent-6-vivid": "coral-vivid",
    "accent-1-deep": "marigold-deep", "accent-2-deep": "terracotta-deep", "accent-3-deep": "lavender-deep",
    "accent-4-deep": "sage-deep", "accent-5-deep": "petrol", "accent-6-deep": "coral-deep",
  };
  const fallbackTone = structuralFallback[resolvedTone] || tone;
  const t = surfaces.find((surface) => surface.id === resolvedTone) || legacy[fallbackTone] || legacy.paper;
  const contentTone = t.contentTone || "dark";
  const background = t.value || `var(${t.cssVar})`;
  return (
    <section
      className="aula-fullbleed"
      data-content-tone={contentTone}
      data-dark={contentTone === "light" ? "" : undefined}
      style={{ "--fb-bg": background, "--fb-py": py }}
    >
      {children}
    </section>
  );
}

function Callout({ variant, ariaLabel, label, icon, defaultIcon, iconTokens, iconFallback, tone, question, children }) {

  const style = colors ? {
    "--callout-base": colors.base,

    <aside className={"aula-callout aula-" + variant} aria-label={ariaLabel} data-tone={colors ? tone : undefined} style={style}>
      <header className="aula-callout__head">

// TERMO — glossary term with a click-to-open definition.
// Flui inline (sublinhado pontilhado); click/Enter abre popover.
// Estilos do popover vivem em colors_and_type.css (.termo*).
let _termoSetters = new Set();
function Termo({ children, def, termo, rotulo = "Glossário" }) {
  if (usePDF()) {
    // PDF: references are numbered by PDFGlossary and resolved at the end.
    return (
      <span className="aula-termo-print" data-glossary-term={termo || (typeof children === "string" ? children : undefined)} data-glossary-definition={def}>
        <span className="aula-termo-print__word">{children}</span>
        <sup className="aula-termo-print__ref" aria-label="Nota de glossário"></sup>
      </span>
    );
  }
  const [open, setOpen] = React.useState(false);
  const [below, setBelow] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const setter = (v) => setOpen(v);
    _termoSetters.add(setter);
    return () => _termoSetters.delete(setter);
  }, []);

  React.useEffect(() => {
    if (!open) return;
    const el = ref.current;
    const pop = el && el.querySelector(".termo__pop");
    if (el && pop) {
      const r = el.getBoundingClientRect();
      setBelow(r.top < pop.offsetHeight + 28);
    }
    const onDoc = (e) => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("click", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("click", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  const toggle = (e) => {
    e.stopPropagation();
    const next = !open;
    if (next) _termoSetters.forEach((s) => s !== setOpen && s(false)); // close others
    setOpen(next);
  };
  const onKey = (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      toggle(e);
    }
  };

  return (
    <span
      ref={ref}
      className={"termo" + (below ? " termo--below" : "")}
      role="button"
      tabIndex={0}
      aria-expanded={open ? "true" : "false"}
      onClick={toggle}
      onKeyDown={onKey}
    >
      {children}
      <span className="termo__pop" role="tooltip">
        <span className="termo__label">{rotulo}</span>
        <span className="termo__word">{termo || children}</span>
        <span className="termo__def">{def}</span>
      </span>
    </span>
  );
}

function PDFGlossary({ title = "Glossário" }) {
  const pdf = usePDF();
  const [entries, setEntries] = useState([]);

  useEffect(() => {
    if (!pdf) return;
    const found = [];
    const byKey = new Map();
    document.querySelectorAll(".aula-termo-print, .termo").forEach((node) => {
      if (node.closest(".aula-pdf-glossary")) return;
      const pop = node.querySelector(".termo__pop");
      const term = (node.dataset.glossaryTerm || pop?.querySelector(".termo__word")?.textContent || node.childNodes[0]?.textContent || "").trim();
      const definition = (node.dataset.glossaryDefinition || pop?.querySelector(".termo__def")?.textContent || "").trim();
      if (!term || !definition) return;
      const key = `${term.toLocaleLowerCase("pt-BR")}\u0000${definition}`;
      let entry = byKey.get(key);
      if (!entry) {
        entry = { number: found.length + 1, term, definition };
        byKey.set(key, entry);
        found.push(entry);
      }
      let ref = node.querySelector(":scope > .aula-termo-print__ref");
      if (!ref) {
        ref = document.createElement("sup");
        ref.className = "aula-termo-print__ref";
        node.appendChild(ref);
      }
      ref.textContent = String(entry.number);
    });
    setEntries(found);
  }, [pdf]);

  if (!pdf || !entries.length) return null;
  return (
    <section className="aula-pdf-glossary" aria-label={title}>
      <h2>{title}</h2>
      <ol>
        {entries.map((entry) => (
          <li key={`${entry.number}-${entry.term}`}>
            <strong>{entry.term}.</strong> {entry.definition}
          </li>
        ))}
      </ol>
    </section>
  );
}
