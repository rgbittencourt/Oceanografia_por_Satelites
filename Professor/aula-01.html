<!doctype html>
<html lang="pt-BR" data-theme="lightning">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fundamentos de radar: como enxergar com micro-ondas e eco</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css" />
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
<style>

</style>
<style>
/* ============================================================
   Lightning (inspirado no Salesforce Lightning Design System) — Foundations for ClassAtelier
   Mesmos NOMES de variáveis e seletores do tema Aula, para que os
   componentes re-skinnem sozinhos. Cores do SLDS (BSD-3-Clause). Sem a fonte Salesforce Sans nem o logotipo: usa a letra do aparelho.
   ============================================================ */

@import url("./fonts/fonts.css");

:root {
  /* ─── Superfícies ─────────────────────────────────────────── */
  --paper:        #ffffff;
  --paper-warm:   #f3f3f3;
  --sand:         #ecebea;
  --bone:         #ffffff;
  --ink:          #181818;
  --ink-soft:     #2e2e2e;
  --ink-mute:     #444444;
  --ink-faint:    #5c5c5c;
  --rule:         #c9c9c9;
  --rule-strong:  #8c8c8c;

  --content-dark-primary: var(--ink);
  --content-dark-secondary: var(--ink-soft);
  --content-dark-muted: var(--ink-mute);
  --content-dark-faint: var(--ink-faint);
  --content-dark-border: var(--rule);
  --content-dark-border-strong: var(--rule-strong);
  --content-light-primary: #ffffff;
  --content-light-secondary: color-mix(in oklab, #ffffff 86%, transparent);
  --content-light-muted: color-mix(in oklab, #ffffff 74%, transparent);
  --content-light-faint: color-mix(in oklab, #ffffff 60%, transparent);
  --content-light-border: color-mix(in oklab, #ffffff 24%, transparent);
  --content-light-border-strong: color-mix(in oklab, #ffffff 42%, transparent);

  /* ─── Paleta de acentos (mesmos 6 slots do Aula) ──────────── */
  --marigold:   #ffb75d;
  --marigold-soft: #fff3df;
  --marigold-deep: #6b3f00;
  --terracotta: #ba0517;
  --terracotta-soft: #fef1ee;
  --terracotta-deep: #6b0a12;
  --lavender:   #7f4bd6;
  --lavender-soft: #f6efff;
  --lavender-deep: #4b2490;
  --sage:       #2e844a;
  --sage-soft:  #ebf7e6;
  --sage-deep:  #194e31;
  --ocean:      #0176d3;
  --ocean-soft: #eef4ff;
  --ocean-deep: #014486;
  --coral:      #06847c;
  --coral-soft: #e0f7f6;
  --coral-deep: #0b5c55;

  --hl-yellow:  rgba(255,183,93,0.45);
  --hl-pink:    rgba(186,5,23,0.18);
  --hl-green:   rgba(46,132,74,0.22);
  --hl-blue:    rgba(1,118,211,0.2);

  /* ─── Tipografia ──────────────────────────────────────────── */
  --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif:   -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-sans:    -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --fs-display:   clamp(2.5rem, 1.5rem + 3.8vw, 3.5rem); /* @kind other */
  --fs-h1:        clamp(1.875rem, 1.3rem + 2.2vw, 2.5rem); /* @kind other */
  --fs-h2:        clamp(1.5rem, 1.15rem + 1.3vw, 1.875rem); /* @kind other */
  --fs-h3:        1.375rem; /* @kind font */
  --fs-h4:        1.125rem; /* @kind font */
  --fs-lead:      1.1875rem; /* @kind font */
  --fs-body:      1rem; /* @kind font */
  --fs-small:     0.9375rem; /* @kind font */
  --fs-meta:      0.875rem; /* @kind font */
  --fs-cap:       0.75rem; /* @kind font */

  --lh-tight:     1.15; /* @kind font */
  --lh-snug:      1.25; /* @kind font */
  --lh-body:      1.6; /* @kind font */
  --lh-loose:     1.7; /* @kind font */

  --ls-display:   -0.01em; /* @kind font */
  --ls-tight:     0; /* @kind font */
  --ls-eyebrow:   0.06em; /* @kind font */

  --measure:      66ch; /* @kind spacing */
  --page-pad:     clamp(1.25rem, 4vw, 3rem); /* @kind spacing */

  --sp-0: 0; /* @kind spacing */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-7: 3rem;
  --sp-8: 4rem;
  --sp-9: 6rem;
  --sp-10: 8rem;

  --r-0: 0; /* @kind radius */
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 8px;
  --r-xl: 12px;
  --r-pill: 999px;

  --sh-1: 0 2px 2px 0 rgba(0,0,0,.10);
  --sh-2: 0 2px 3px 0 rgba(0,0,0,.16);
  --sh-3: 0 2px 3px 0 rgba(0,0,0,.16);
  --sh-inset: inset 0 0 0 1px rgba(0,0,0,0.04);

  --ease-out:  cubic-bezier(0.2, 0, 0, 1); /* @kind other */
  --ease-in:   cubic-bezier(0.3, 0, 1, 1); /* @kind other */
  --ease-spring: cubic-bezier(0.34, 1.3, 0.5, 1); /* @kind other */
  --dur-1: 120ms; /* @kind other */
  --dur-2: 240ms; /* @kind other */
  --dur-3: 400ms; /* @kind other */
  --dur-4: 700ms; /* @kind other */
}

/* ============================================================
   Base styles
   ============================================================ */

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-feature-settings: "kern", "liga", "calt";
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::selection { background: #d8e6fe; color: var(--ink); } /* blue 20 */

/* ─── Typography elements ───────────────────────────────── */

h1, .h1 {
  font-family: var(--font-sans);
  font-size: var(--fs-h1);
  font-weight: 400;
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-display);
  margin: 0 0 var(--sp-4);
  color: var(--ink);
  text-wrap: balance;
}
h2, .h2 {
  font-family: var(--font-sans);
  font-size: var(--fs-h2);
  font-weight: 400;
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-tight);
  margin: var(--sp-7) 0 var(--sp-3);
  text-wrap: balance;
}
h3, .h3 {
  font-family: var(--font-sans);
  font-size: var(--fs-h3);
  font-weight: 600;
  line-height: var(--lh-snug);
  margin: var(--sp-6) 0 var(--sp-2);
}
h4, .h4 {
  font-family: var(--font-sans);
  font-size: var(--fs-h4);
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: 0;
  margin: var(--sp-5) 0 var(--sp-2);
}

.display {
  font-family: var(--font-display);
  font-size: var(--fs-display);
  font-weight: 300;             /* Lightning: display é leve */
  line-height: 1.07;
  letter-spacing: var(--ls-display);
  text-wrap: balance;
}

.lead {
  font-family: var(--font-sans);
  font-style: normal;
  font-weight: 400;
  font-size: var(--fs-lead);
  line-height: 1.45;
  color: var(--ink-mute);
  text-wrap: pretty;
}

p {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  margin: 0 0 var(--sp-5);
  text-wrap: pretty;
}

/* ─── Drop cap ───────────────────────────────────────────── */
.dropcap::first-letter,
.dropcap > :first-child::first-letter {
  float: left;
  font-family: var(--font-sans);
  font-weight: 300;
  font-style: normal;
  font-size: 3.5em;
  line-height: 0.8;
  padding: 0.04em 0.1em 0 0;
  margin: 0.1em 0.04em 0 0;
  color: var(--ocean);          /*  blue */
}
.dropcap-ink::first-letter,      .dropcap-ink > :first-child::first-letter      { color: var(--ink); }
.dropcap-ocean::first-letter,    .dropcap-ocean > :first-child::first-letter    { color: var(--ocean); }
.dropcap-sage::first-letter,     .dropcap-sage > :first-child::first-letter     { color: var(--sage); }
.dropcap-lavender::first-letter, .dropcap-lavender > :first-child::first-letter { color: var(--lavender); }
.dropcap-marigold::first-letter, .dropcap-marigold > :first-child::first-letter { color: var(--marigold-deep); }

.eyebrow {
  font-family: var(--font-sans);
  font-size: var(--fs-cap);
  font-weight: 600;
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--ink-mute);
}

.meta {
  font-family: var(--font-sans);
  font-size: var(--fs-meta);
  color: var(--ink-mute);
  line-height: 1.4;
}

.caption {
  font-family: var(--font-sans);
  font-size: var(--fs-meta);
  color: var(--ink-mute);
  line-height: 1.45;
  font-style: normal;
}

a {
  color: var(--ocean);          /* Lightning link-primary */
  text-decoration: underline;
  text-decoration-color: color-mix(in oklab, var(--ocean) 40%, transparent);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  transition: text-decoration-color var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}
a:hover { color: var(--ocean-deep); text-decoration-color: currentColor; }

strong, b { font-weight: 600; color: var(--ink); }
em, i { font-style: italic; }

blockquote {
  margin: var(--sp-6) 0;
  padding: var(--sp-1) 0 var(--sp-1) var(--sp-5);
  border-left: 3px solid var(--ocean);
  font-family: var(--font-sans);
  font-style: normal;
  font-weight: 400;
  font-size: 1.25rem;
  line-height: 1.4;
  color: var(--ink-soft);
}

code {
  font-family: var(--font-mono);
  font-size: 0.9em;
  background: var(--paper-warm);
  padding: 0.12em 0.4em;
  border-radius: var(--r-sm);
  color: var(--ink);
}
pre {
  font-family: var(--font-mono);
  font-size: 0.9375rem;
  background: var(--ink);
  color: #f4f4f4;
  padding: var(--sp-5);
  border-radius: var(--r-md);
  overflow-x: auto;
  line-height: 1.5;
}
pre code { background: transparent; padding: 0; color: inherit; }

hr {
  border: 0;
  height: 1px;
  background: var(--rule);
  margin: var(--sp-7) auto;
  width: 100%;
}

ul, ol {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  padding-left: 1.4em;
  margin: 0 0 var(--sp-5);
}
li { margin-bottom: var(--sp-2); }
li::marker { color: var(--ink-mute); }

img { max-width: 100%; height: auto; display: block; }

/* ─── Highlighter mark ───────────────────────────────────── */
mark, .mark, .hl {
  background: linear-gradient(
    100deg,
    transparent 0.4%,
    var(--hl-yellow) 1%,
    var(--hl-yellow) 99%,
    transparent 99.6%
  );
  background-size: 100% 60%;
  background-position: 0 60%;
  background-repeat: no-repeat;
  padding: 0.05em 0.12em;
  color: inherit;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.hl-pink  { background-image: linear-gradient(100deg, transparent 0.4%, var(--hl-pink) 1%, var(--hl-pink) 99%, transparent 99.6%); }
.hl-green { background-image: linear-gradient(100deg, transparent 0.4%, var(--hl-green) 1%, var(--hl-green) 99%, transparent 99.6%); }
.hl-blue  { background-image: linear-gradient(100deg, transparent 0.4%, var(--hl-blue) 1%, var(--hl-blue) 99%, transparent 99.6%); }

/* Underline scribble — em azul Lightning */
.scribble {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12' preserveAspectRatio='none'><path d='M2 7 Q 30 2, 60 6 T 120 7 T 198 5' stroke='%230f62fe' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-size: 100% 0.42em;
  background-position: 0 100%;
  padding-bottom: 0.18em;
}

/* ─── Glossário ──────────────────────────────────────────── */
.termo {
  display: inline;
  position: relative;
  cursor: help;
  text-decoration: underline;
  text-decoration-style: dotted;
  text-decoration-color: var(--rule-strong);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
  transition: text-decoration-color var(--dur-1) var(--ease-out);
}
.termo:hover,
.termo:focus-visible,
.termo[aria-expanded="true"] { text-decoration-color: var(--ocean); }

.termo__pop {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 11px);
  transform: translateX(-50%) translateY(5px);
  z-index: 60;
  width: max-content;
  max-width: min(290px, 78vw);
  padding: 13px 16px 14px;
  text-align: left;
  background: var(--bone);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  box-shadow: var(--sh-3);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity var(--dur-2) var(--ease-out),
              transform var(--dur-2) var(--ease-out),
              visibility var(--dur-2) linear;
}
.termo[aria-expanded="true"] .termo__pop {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.termo__pop::before {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 7px solid transparent;
  border-top-color: var(--bone);
  filter: drop-shadow(0 1px 0 var(--rule));
}
.termo--below .termo__pop { bottom: auto; top: calc(100% + 11px); }
.termo--below .termo__pop::before {
  top: auto;
  bottom: 100%;
  border-top-color: transparent;
  border-bottom-color: var(--bone);
  filter: drop-shadow(0 -1px 0 var(--rule));
}
.termo__label {
  display: block;
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: var(--ls-eyebrow);
  text-transform: uppercase;
  color: var(--ocean);
  margin-bottom: 5px;
}
.termo__word {
  display: block;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 3px;
}
.termo__def {
  display: block;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-soft);
}

/* ─── Auto-contraste em faixas escuras ───────────────────── */
.aula-fullbleed[data-dark] a { color: inherit; text-decoration-color: color-mix(in oklab, currentColor 45%, transparent); }
.aula-fullbleed[data-dark] a:hover { text-decoration-color: var(--marigold); }
.aula-fullbleed[data-dark] strong,
.aula-fullbleed[data-dark] b { color: inherit; }
.aula-fullbleed[data-dark] code { background: color-mix(in oklab, currentColor 16%, transparent); color: inherit; }
.aula-fullbleed[data-dark] blockquote { color: inherit; border-left-color: color-mix(in oklab, currentColor 55%, transparent); }
.aula-fullbleed[data-dark] li::marker { color: color-mix(in oklab, currentColor 62%, transparent); }
.aula-fullbleed[data-dark] hr { background: color-mix(in oklab, currentColor 24%, transparent); }
.aula-fullbleed[data-dark] .dropcap::first-letter,
.aula-fullbleed[data-dark] .dropcap > :first-child::first-letter { color: var(--marigold); }
.aula-fullbleed[data-dark] .termo { text-decoration-color: color-mix(in oklab, currentColor 50%, transparent); }
.aula-fullbleed[data-dark] .termo:hover,
.aula-fullbleed[data-dark] .termo[aria-expanded="true"] { text-decoration-color: var(--marigold); }

/* ─── Case cards — grade responsiva ──────────────────────── */
.aula-cases-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
}
@media (min-width: 560px) {
  .aula-cases-grid[data-cols="2"],
  .aula-cases-grid[data-cols="3"] { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 900px) {
  .aula-cases-grid[data-cols="3"] { grid-template-columns: repeat(3, 1fr); }
}
.aula-case-card { display: flex; flex-direction: column; }
.aula-case-cover { aspect-ratio: 3 / 2; }

.aula-cases-grid.is-horizontal { grid-template-columns: 1fr; }
@media (min-width: 800px) {
  .aula-cases-grid.is-horizontal[data-cols="2"] { grid-template-columns: repeat(2, 1fr); }
}
.aula-cases-grid.is-horizontal .aula-case-card { flex-direction: row; align-items: stretch; }
.aula-cases-grid.is-horizontal .aula-case-cover {
  aspect-ratio: auto;
  flex: 0 0 42%;
  min-height: 150px;
}
.aula-cases-grid.is-horizontal .aula-case-body { justify-content: center; }
@media (max-width: 519px) {
  .aula-cases-grid.is-horizontal .aula-case-card { flex-direction: column; }
  .aula-cases-grid.is-horizontal .aula-case-cover { flex: none; aspect-ratio: 3 / 2; min-height: 0; }
}

/* ─── Feature grid ───────────────────────────────────────── */
.aula-feature-grid { grid-template-columns: 1fr; }
@media (min-width: 560px) {
  .aula-feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 880px) {
  .aula-feature-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.aula-feature-item i { line-height: 1; }

/* ─── Tópico de conteúdo ─────────────────────────────────── */
.aula-topic { display: flex; flex-direction: column; }
.aula-topic > .aula-topic-item { margin: 0; }
.aula-topic > .aula-topic-item > * { margin-top: 0 !important; margin-bottom: 0 !important; }
.aula-topic > .aula-topic-item + .aula-topic-item { margin-top: 1.15em; }
.aula-topic > .aula-topic-item[data-type="prose"] p + p { margin-top: 0.9em; }
.aula-topic > .aula-topic-item[data-type="titulo"] { margin-top: 2.1em; }
.aula-topic > .aula-topic-item[data-type="titulo"] + .aula-topic-item { margin-top: 0.65em; }
.aula-topic > .aula-topic-item[data-type="destaque"],
.aula-topic > .aula-topic-item[data-type="atencao"],
.aula-topic > .aula-topic-item[data-type="reflexao"],
.aula-topic > .aula-topic-item[data-type="pitaco"],
.aula-topic > .aula-topic-item[data-type="citacao"] { margin-top: 1.5em; }
.aula-topic > .aula-topic-item:first-child { margin-top: 0 !important; }

/* ─── Focus ring — azul Lightning ───────────────────────────── */
:focus-visible {
  outline: 2px solid var(--ocean);
  outline-offset: 2px;
  border-radius: 0;
}

/* ─── Reduced motion ─────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ─── Ajustes Lightning ──────────────────────────────────── */
h1, .h1, .display { font-weight: 700; }
h2, .h2, h3, .h3, h4, .h4 { font-weight: 700; }
.eyebrow { font-weight: 700; }
a { color: #0176d3; }
a:hover { color: #014486; }
blockquote { border-left-color: var(--ocean); }
:focus-visible { outline: 0; box-shadow: 0 0 3px #0176d3; border-radius: var(--r-md); outline: 2px solid #0176d3; outline-offset: 1px; }

/* ═══ PERSONALIDADE DO TEMA — o que, além de cor e letra, distingue este tema dos outros ═══
   Tudo passa por variáveis --p-*; a miniatura do seletor de temas lê as mesmas variáveis. */
:root .aula-hero { background: var(--p-hero-bg, transparent); border-bottom: var(--p-hero-border, 0); }
:root .aula-hero__inner { background: var(--p-hero-inner-bg, transparent); border-radius: var(--p-hero-inner-r, 0); padding-block: var(--p-hero-inner-pad, 0); }
:root .aula-hero__title { color: var(--p-hero-fg, var(--ink)); font-weight: var(--p-hero-weight, 600); font-size: var(--p-hero-size, clamp(2.5rem, 1.5rem + 4vw, 4rem)); padding-bottom: var(--p-hero-title-pb, 0); border-bottom: var(--p-hero-title-rule, 0); }
:root .aula-hero__title::before { content: ""; display: block; width: 64px; height: var(--p-hero-bar-h, 0); border-radius: 3px; background: var(--p-hero-bar, transparent); margin-bottom: var(--p-hero-bar-mb, 0); }
:root .aula-hero__lead { color: var(--p-hero-lead, var(--ink-soft)); font-style: var(--p-lead-style, normal); }
:root .aula-hero__meta { border-top-color: var(--p-hero-rule, var(--rule)); }
:root .aula-hero__author { color: var(--p-hero-fg, var(--ink)); }
:root .aula-hero__byline { color: var(--p-hero-lead, var(--ink-mute)); }
:root .aula-hero__eyebrow, :root .aula-topic-eyebrow {
  width: fit-content; align-self: flex-start;
  background: var(--p-eyebrow-bg, transparent); border: var(--p-eyebrow-border, 0); border-radius: var(--p-eyebrow-r, 0);
