<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Comparação entre sensor passivo, que depende do Sol e é bloqueado pela nuvem na luz visível, e sensor ativo, que emite micro-ondas, atravessa a nuvem, atinge a superfície do mar e recebe o eco de volta">
<defs>
<marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="#fbf9f4"/>
<line x1="480" y1="20" x2="480" y2="520" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 8"/>
<text x="240" y="40" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1f2a44" text-anchor="middle">Sensor passivo</text>
<text x="720" y="40" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1f2a44" text-anchor="middle">Sensor ativo</text>
<circle cx="90" cy="115" r="30" fill="#c8553d"/>
<text x="90" y="170" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Sol</text>
<text x="90" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">(fonte de energia)</text>
<rect x="320" y="70" width="140" height="56" rx="8" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
<text x="390" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Sensor</text>
<text x="390" y="117" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">passivo</text>
<g fill="#e8e4da" stroke="#8a7fb0" stroke-width="3">
<circle cx="180" cy="290" r="32"/>
<circle cx="225" cy="272" r="40"/>
<circle cx="275" cy="290" r="34"/>
<rect x="180" y="288" width="95" height="34" stroke="none"/>
</g>
<text x="228" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Nuvem</text>
<line x1="115" y1="138" x2="165" y2="238" stroke="#1f2a44" stroke-width="3" marker-end="url(#aN)"/>
<line x1="190" y1="330" x2="190" y2="400" stroke="#1f2a44" stroke-width="3" stroke-dasharray="6 6"/>
<text x="95" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d" text-anchor="middle">luz visível</text>
<text x="95" y="360" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d" text-anchor="middle">bloqueada</text>
<line x1="390" y1="420" x2="390" y2="132" stroke="#1f2a44" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#aN)"/>
<text x="400" y="228" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44">energia</text>
<text x="400" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44">refletida</text>
<text x="400" y="272" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44">ou emitida</text>
<rect x="570" y="70" width="140" height="56" rx="8" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
<text x="640" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Sensor</text>
<text x="640" y="117" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">ativo</text>
<text x="800" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44">Fonte de energia</text>
<text x="800" y="112" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44">no próprio sensor</text>
<g fill="#e8e4da" stroke="#8a7fb0" stroke-width="3">
<circle cx="580" cy="290" r="32"/>
<circle cx="625" cy="272" r="40"/>
<circle cx="675" cy="290" r="34"/>
<rect x="580" y="288" width="95" height="34" stroke="none"/>
</g>
<text x="628" y="304" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Nuvem</text>
<line x1="610" y1="132" x2="610" y2="410" stroke="#c8553d" stroke-width="4" marker-end="url(#aT)"/>
<line x1="670" y1="420" x2="670" y2="132" stroke="#c8553d" stroke-width="4" marker-end="url(#aT)"/>
<text x="600" y="180" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d" text-anchor="end">pulso de</text>
<text x="600" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d" text-anchor="end">micro-ondas</text>
<text x="685" y="400" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d">eco</text>
<rect x="30" y="420" width="420" height="50" fill="#5b8a72"/>
<text x="240" y="452" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fbf9f4" text-anchor="middle">Superfície do mar</text>
<rect x="510" y="420" width="420" height="50" fill="#5b8a72"/>
<text x="720" y="452" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fbf9f4" text-anchor="middle">Superfície do mar</text>
<text x="240" y="505" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Depende de fonte externa</text>
<text x="720" y="505" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2a44" text-anchor="middle">Leva a própria fonte e atravessa a nuvem</text>
</svg>