<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Condição de Bragg: a onda do radar incide com ângulo θ sobre cristas do mar espaçadas de λ_B; a diferença de caminho dos ecos de cristas vizinhas é um comprimento de onda do radar, e o retorno interfere construtivamente.">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8553d"/></marker>
<marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="#fbf9f4"/>
<text x="480" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1f2a44">Condição de Bragg</text>
<rect x="30" y="52" width="170" height="40" rx="6" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
<text x="115" y="79" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">antena</text>
