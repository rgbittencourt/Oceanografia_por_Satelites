<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Fluxograma do ciclo pulso-eco: o transmissor gera o pulso, o duplexador o encaminha à antena, que o emite ao alvo; o eco volta pela antena e pelo duplexador até o receptor. O tempo de ida e volta t dá a distância R = c·t/2.">
  <defs>
    <marker id="aT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c8553d"/>
    </marker>
    <marker id="aS" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b8a72"/>
    </marker>
    <marker id="aN" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#fbf9f4"/>

  <text x="480" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#1f2a44">Ciclo pulso-eco do radar</text>

  <!-- Transmissor -->
  <rect x="30" y="130" width="160" height="80" rx="10" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
  <text x="110" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1f2a44">Transmissor</text>

  <!-- Receptor -->
  <rect x="30" y="330" width="160" height="80" rx="10" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
  <text x="110" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1f2a44">Receptor</text>

  <!-- Duplexador -->
  <rect x="290" y="210" width="170" height="120" rx="10" fill="#8a7fb0" stroke="#1f2a44" stroke-width="2"/>
  <text x="375" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fbf9f4">Duplexador</text>
  <text x="375" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fbf9f4">alterna TX / RX</text>

  <!-- Antena -->
  <rect x="540" y="230" width="130" height="80" rx="10" fill="#5b8a72" stroke="#1f2a44" stroke-width="2"/>
  <text x="605" y="277" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fbf9f4">Antena</text>

  <!-- Alvo -->
  <circle cx="860" cy="270" r="62" fill="#e8e4da" stroke="#c8553d" stroke-width="3"/>
  <text x="860" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#1f2a44">Alvo</text>

  <!-- Transmissor -> Duplexador -->
  <path d="M190,170 L240,170 L240,250 L286,250" fill="none" stroke="#c8553d" stroke-width="3" marker-end="url(#aT)"/>
  <text x="62" y="108" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d">1 · gera o pulso</text>

  <!-- Duplexador -> Receptor -->
  <path d="M286,290 L240,290 L240,370 L194,370" fill="none" stroke="#5b8a72" stroke-width="3" marker-end="url(#aS)"/>
  <text x="62" y="440" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5b8a72">5 · amplifica e registra o eco</text>

  <!-- Duplexador <-> Antena -->
  <line x1="460" y1="250" x2="536" y2="250" stroke="#c8553d" stroke-width="3" marker-end="url(#aT)"/>
  <line x1="536" y1="290" x2="464" y2="290" stroke="#5b8a72" stroke-width="3" marker-end="url(#aS)"/>

  <!-- Antena -> Alvo (pulso) -->
  <line x1="670" y1="250" x2="792" y2="250" stroke="#c8553d" stroke-width="3" marker-end="url(#aT)"/>
  <text x="731" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8553d">pulso</text>

  <!-- Alvo -> Antena (eco) -->
  <line x1="800" y1="296" x2="674" y2="296" stroke="#5b8a72" stroke-width="3" marker-end="url(#aS)"/>
  <text x="737" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5b8a72">eco</text>

  <!-- Distância R -->
  <line x1="605" y1="440" x2="855" y2="440" stroke="#1f2a44" stroke-width="2" marker-start="url(#aN)" marker-end="url(#aN)"/>
  <line x1="605" y1="310" x2="605" y2="452" stroke="#1f2a44" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="855" y1="332" x2="855" y2="452" stroke="#1f2a44" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="730" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1f2a44">R (antena–alvo)</text>

  <!-- Tempo e fórmula -->
  <text x="480" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">t = tempo de ida e volta (saída do pulso até a chegada do eco)</text>
  <text x="480" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#c8553d">R = c · t / 2</text>
</svg>