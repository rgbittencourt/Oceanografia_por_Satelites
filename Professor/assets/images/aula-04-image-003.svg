<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Espalhamento de Bragg: feixe de radar incidente com ângulo θ sobre uma onda curta de comprimento λ_Bragg igual a λ_radar dividido por 2 sen θ, com retorno coerente ao radar; onda longa de fundo não ressoa">
<defs>
<marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f2a44"/></marker>
<marker id="aT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#c8553d"/></marker>
</defs>
<rect width="960" height="540" fill="#fbf9f4"/>
<!-- radar -->
<rect x="355" y="30" width="100" height="40" rx="6" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
<text x="405" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">Radar</text>
<!-- vertical (normal) -->
<line x1="560" y1="100" x2="560" y2="330" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 6"/>
<!-- feixe incidente -->
<line x1="405" y1="75" x2="545" y2="268" stroke="#1f2a44" stroke-width="4" marker-end="url(#aB)"/>
<!-- retorno coerente -->
<line x1="580" y1="268" x2="440" y2="75" stroke="#c8553d" stroke-width="4" marker-end="url(#aT)"/>
<!-- arco do ângulo -->
<path d="M 560 170 A 70 70 0 0 0 527 188" fill="none" stroke="#1f2a44" stroke-width="2.5"/>
<text x="496" y="162" font-family="Arial, Helvetica, sans-serif" font-size="26" font-style="italic" fill="#1f2a44">θ</text>
<!-- onda longa de fundo -->
<path d="M 60 340 C 190 262, 330 262, 460 340 S 730 418, 900 340" fill="none" stroke="#8a7fb0" stroke-width="5"/>
<path d="M 60 340 C 190 262, 330 262, 460 340 S 730 418, 900 340 L 900 500 L 60 500 Z" fill="#8a7fb0" fill-opacity="0.12"/>
<!-- onda curta em corte -->
<path d="M 420 276 q 17.5 -18 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0 t 35 0" fill="none" stroke="#5b8a72" stroke-width="4"/>
<!-- cota λ_Bragg -->
<line x1="490" y1="302" x2="560" y2="302" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="560" y1="302" x2="490" y2="302" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#aB)"/>
<text x="525" y="330" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5b8a72" font-weight="bold" text-anchor="middle">λ_Bragg</text>
<!-- rótulos à direita -->
<text x="640" y="95" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">λ_radar: comprimento de onda</text>
<text x="640" y="125" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">do radar</text>
<text x="640" y="182" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c8553d">retorno coerente</text>
<!-- fórmula -->
<rect x="610" y="215" width="320" height="50" rx="8" fill="#e8e4da" stroke="#c8553d" stroke-width="2"/>
<text x="770" y="249" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2a44" text-anchor="middle">λ_Bragg = λ_radar / (2 sen θ)</text>
<!-- rótulos das ondas -->
<text x="360" y="232" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5b8a72" text-anchor="end">onda curta (ressoa)</text>
<text x="480" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8a7fb0" font-weight="bold" text-anchor="middle">onda longa (não ressoa)</text>
<text x="480" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">apenas inclina a superfície das curtas</text>
</svg>