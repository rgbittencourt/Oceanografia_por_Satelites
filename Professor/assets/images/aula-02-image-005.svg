<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Duas geometrias de observação sobre o mar: visada no nadir com ângulo de incidência 0 grau e visada oblíqua com ângulo de incidência θ medido entre o feixe e a normal local">
  <defs>
    <marker id="seta" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c8553d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="#fbf9f4"/>

  <line x1="480" y1="70" x2="480" y2="470" stroke="#1f2a44" stroke-width="1.5" stroke-dasharray="3 6"/>

  <text x="240" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1f2a44" text-anchor="middle">Visada no nadir</text>
  <text x="720" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1f2a44" text-anchor="middle">Visada oblíqua</text>

  <!-- Painel esquerdo -->
  <rect x="190" y="95" width="100" height="32" rx="4" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
  <text x="240" y="119" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">Antena</text>

  <line x1="240" y1="127" x2="240" y2="338" stroke="#c8553d" stroke-width="5" marker-end="url(#seta)"/>
  <text x="258" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c8553d">Feixe</text>

  <line x1="240" y1="340" x2="240" y2="270" stroke="#1f2a44" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="258" y="296" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">Normal local</text>

  <path d="M25,350 Q70,335 115,350 T205,350 T295,350 T385,350 T455,350 L455,470 L25,470 Z" fill="#5b8a72" fill-opacity="0.35"/>
  <path d="M25,350 Q70,335 115,350 T205,350 T295,350 T385,350 T455,350" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="240" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">Superfície do mar</text>

  <text x="240" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#c8553d" text-anchor="middle">Ângulo de incidência = 0°</text>

  <!-- Painel direito -->
  <rect x="610" y="95" width="100" height="32" rx="4" fill="#e8e4da" stroke="#1f2a44" stroke-width="2"/>
  <text x="660" y="119" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">Antena</text>

  <line x1="660" y1="127" x2="800" y2="339" stroke="#c8553d" stroke-width="5" marker-end="url(#seta)"/>
  <text x="780" y="218" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c8553d">Feixe</text>

  <line x1="800" y1="340" x2="800" y2="140" stroke="#1f2a44" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="815" y="170" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44">Normal local</text>

  <path d="M800,222 A118,118 0 0 0 750,236" fill="none" stroke="#8a7fb0" stroke-width="4"/>
  <text x="725" y="252" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#8a7fb0" text-anchor="middle">θ</text>

  <path d="M505,350 Q550,335 595,350 T685,350 T775,350 T865,350 T935,350 L935,470 L505,470 Z" fill="#5b8a72" fill-opacity="0.35"/>
  <path d="M505,350 Q550,335 595,350 T685,350 T775,350 T865,350 T935,350" fill="none" stroke="#1f2a44" stroke-width="3"/>
  <text x="720" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2a44" text-anchor="middle">Superfície do mar</text>

  <text x="720" y="500" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#8a7fb0" text-anchor="middle">Ângulo de incidência = θ</text>
</svg>